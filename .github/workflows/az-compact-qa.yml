name: A-Z compact presentation QA
on:
  push:
    branches: [fix/az-compact-pagination-20261010]
    paths: [.github/workflows/az-compact-qa.yml, js/passport-artist-navigation.js, tests/validate_az_compact.cjs]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.html
            *.js
            *.cjs
            *.css
            *.json
            *.py
            *.ttf
            *.yml
            /assets/blog/artists/*
            /images/payments/*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate only existing A-Z presentation
        run: python3 tools/compact_az_presentation.py
      - name: Validate requested cases and original pictures
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/validate_az_compact.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: az-compact-evidence
          path: docs/az-compact-pagination-20261010/
      - name: Persist exact A-Z files and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse blog/arquivo/letras.html blog/arquivo/letras/*.html docs/az-compact-pagination-20261010/
          git diff --cached --quiet || git commit -m 'fix(az): compact static pagination and persist visual evidence'
          git push origin HEAD:fix/az-compact-pagination-20261010
