name: Passport Pages

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/pages.yml', 'scripts/generate-sitemaps.mjs', 'scripts/validate-sitemaps.py', 'sitemap*.xml', 'robots.txt']
  workflow_dispatch:

permissions:
  contents: read

# Pages Settings > Build and deployment > Source must use GitHub Actions.
# A new publication waits instead of canceling an active build/deployment.
concurrency:
  group: passport-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Set up Node for public sitemaps
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate the nine public sitemaps
        run: node scripts/generate-sitemaps.mjs
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate sitemap XML and HTTP 200 against the generated Pages artifact
        run: python3 scripts/validate-sitemaps.py --root _site --http
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
