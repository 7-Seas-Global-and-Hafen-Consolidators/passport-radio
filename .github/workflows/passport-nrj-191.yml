name: Passport NRJ 191 — one controlled playback round
on:
  pull_request:
    paths:
      - 'js/world-radio-player.js'
      - 'css/passport-radio-grid.css'
      - 'data/passport-radio-inventory.json'
      - 'tests/passport_nrj_browser.cjs'
      - '.github/workflows/passport-nrj-191.yml'
permissions:
  contents: read
jobs:
  playback:
    if: github.head_ref == 'feat/passport-nrj-191-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /js/
            /css/
            /assets/*.js
            /assets/*.css
            /assets/home/
            /images/editorial/wayne-hussey.png
            /images/editorial/2026-10-07-seven/dave-grohl-acdc-highway-to-hell/
            /images/payments/
            /fonts/
            /data/
            /docs/nrj-catalog-20261012/
            /tests/passport_nrj_browser.cjs
      - name: Reuse completed round on documentation-only updates
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(js/world-radio-player\.js|css/passport-radio-grid\.css|data/passport-radio-inventory\.json|tests/passport_nrj_browser\.cjs|\.github/workflows/passport-nrj-191\.yml)$'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Browser tooling outside application
        if: steps.changed.outputs.run == 'true'
        run: npm install --prefix /tmp/passport-nrj-browser --no-save --package-lock=false playwright
      - name: One media, layout and navigation round — no acquisition
        if: steps.changed.outputs.run == 'true'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/passport-nrj-http.log 2>&1 &
          NODE_PATH=/tmp/passport-nrj-browser/node_modules node tests/passport_nrj_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.run == 'true'
        with:
          name: passport-nrj-191-evidence
          path: reports/nrj-191/
          retention-days: 14
