name: Participe authenticated UI QA
on:
  push:
    branches: [fix/participe-authenticated-submissions-20261010]
    paths: [.github/workflows/participe-auth-qa.yml, tests/validate_participe_auth.cjs]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.html
            *.js
            *.cjs
            *.css
            *.json
            *.ttf
            *.woff2
            *.yml
            *.sql
            *.txt
            /images/participe/mike-marrs.png
            /images/payments/*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused server and browser tests
        run: |
          node --test tests/participe_authenticated.test.cjs
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/validate_participe_auth.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: participe-auth-evidence
          path: docs/participe-auth-20261010/
      - name: Persist only requested evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/participe-auth-20261010/BROWSER-VALIDATION.json docs/participe-auth-20261010/account-*.png docs/participe-auth-20261010/submission-*.png docs/participe-auth-20261010/footer-*.png
          git diff --cached --quiet || git commit -m 'test(participe): persist focused desktop and mobile evidence'
          git push origin HEAD:fix/participe-authenticated-submissions-20261010
