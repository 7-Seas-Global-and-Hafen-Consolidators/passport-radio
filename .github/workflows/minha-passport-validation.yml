name: Minha Passport Validation
on:
  pull_request:
    paths:
      - 'minha-passport.html'
      - 'js/passport-auth.js'
      - 'tests/minha-passport-smoke.mjs'
      - 'tests/minha-passport-static-check.mjs'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/minha-passport-smoke.mjs
      - run: node tests/minha-passport-static-check.mjs
