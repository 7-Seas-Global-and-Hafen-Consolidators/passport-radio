name: Passport vault authenticated read verification

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: passport-vault-read-verification
  cancel-in-progress: false

jobs:
  verify-vault:
    # Credentials are never made available to PR code or arbitrary branch dispatches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: passport-vault-read
    steps:
      - name: Require dedicated vault configuration
        env:
          VAULT_CLIENT_ID: ${{ vars.PASSPORT_VAULT_APP_CLIENT_ID }}
          VAULT_PRIVATE_KEY: ${{ secrets.PASSPORT_VAULT_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$VAULT_CLIENT_ID" ] || [ -z "$VAULT_PRIVATE_KEY" ]; then
            echo "::error::PENDENTE DE AUTORIZACAO: configure the dedicated vault App in passport-vault-read."
            exit 1
          fi
      - name: Mint short-lived read-only vault token
        id: vault-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3 source inspected
        with:
          client-id: ${{ vars.PASSPORT_VAULT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASSPORT_VAULT_APP_PRIVATE_KEY }}
          owner: 7-Seas-Global-and-Hafen-Consolidators
          repositories: passport-radio-internal
          permission-contents: read
          skip-token-revoke: false
      - name: Verify only the pinned private dependency without exporting it
        env:
          VAULT_READ_TOKEN: ${{ steps.vault-token.outputs.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          REPOSITORY = "7-Seas-Global-and-Hafen-Consolidators/passport-radio-internal"
          PRIVATE_REF = "556a29885d4caec4cf1baff4b0811838486044d7"
          PRIVATE_PATH = "vault/tools/editorial_tunnel_graph.py"
          EXPECTED_BLOB = "8dc7f811a0a07c37aed0b28ce90d4ad2c7604ce8"
          API_ROOT = "https://api.github.com/repos/" + REPOSITORY

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def get_json(path, token):
              request = Request(API_ROOT + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2026-03-10",
              })
              with build_opener(NoRedirect()).open(request, timeout=15) as response:
                  payload = response.read(1_000_001)
              if len(payload) > 1_000_000:
                  raise ValueError("response too large")
              return json.loads(payload)

          def verify_snapshot(repository, document):
              if repository.get("full_name") != REPOSITORY or repository.get("private") is not True:
                  raise ValueError("private repository required")
              if document.get("type") != "file" or document.get("path") != PRIVATE_PATH:
                  raise ValueError("unexpected dependency")
              if document.get("sha") != EXPECTED_BLOB or document.get("encoding") != "base64":
                  raise ValueError("unexpected snapshot")
              raw = base64.b64decode("".join(document["content"].split()), validate=True)
              blob = hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()
              if blob != EXPECTED_BLOB:
                  raise ValueError("dependency integrity failure")
              # No write, import, compile, execution, artifact or content output.

          def main():
              token = os.environ.get("VAULT_READ_TOKEN", "")
              if not token:
                  raise ValueError("missing machine credential")
              repository = get_json("", token)
              document = get_json("/contents/" + PRIVATE_PATH + "?ref=" + PRIVATE_REF, token)
              verify_snapshot(repository, document)
              print("PASS: private vault dependency authenticated and integrity verified; no content exported.")

          if __name__ == "__main__":
              try:
                  main()
              except HTTPError as error:
                  raise SystemExit("Vault verification failed: HTTP " + str(error.code)) from None
              except Exception:
                  raise SystemExit("Vault verification failed: configuration, network or integrity check.") from None
          PY
