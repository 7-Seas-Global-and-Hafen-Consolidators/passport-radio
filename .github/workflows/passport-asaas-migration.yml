name: Passport Asaas identity migration
on:
  push:
    branches: [fix/passport-asaas-identity]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/passport-asaas-identity
          fetch-depth: 0
      - name: Migrate Passport payment identity
        shell: python
        run: |
          from pathlib import Path
          import re
          OLD='https://www.asaas.com/c/dwbjyv79vyrfj4ry'
          NEW='https://www.asaas.com/c/shpb8gbiswnw4t2n'
          root=Path('.')
          files=list(root.rglob('*.html'))+list((root/'css').rglob('*.css'))+list((root/'js').rglob('*.js'))
          reps=[
            (r'Operação comercial e processamento de pagamentos realizados por\s*<strong>Guiropa World</strong>\.?','Operação comercial e pagamentos: Passport Radio.'),
            (r'Operação comercial e pagamentos:\s*<strong>Guiropa World</strong>\.?','Operação comercial e pagamentos: Passport Radio.'),
            (r'Operação comercial e pagamentos:\s*<b>Guiropa World</b>\.?','Operação comercial e pagamentos: Passport Radio.'),
            (r'Operação e pagamentos:\s*<strong>Guiropa World</strong>\.?','Operação e pagamentos: Passport Radio.'),
            (r'Operação e pagamentos:\s*<b>Guiropa World</b>\.?','Operação e pagamentos: Passport Radio.'),
            (r'Operação comercial e pagamentos:\s*Guiropa World™?\.?','Operação comercial e pagamentos: Passport Radio.'),
            (r'Operação e pagamentos:\s*Guiropa World™?\.?','Operação e pagamentos: Passport Radio.'),
            (r'Recebimentos processados por GUIROPA WORLD INOVA SIMPLES \(I\.S\.\)\s*[·\-–—]?\s*CNPJ\s*64\.581\.935/0001-91','Recebimentos processados pela Passport Radio.'),
            (r'CNPJ\s*64\.581\.935/0001-91','')]
          changed=[]
          for p in files:
            if not p.is_file(): continue
            try: text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            old=text; text=text.replace(OLD,NEW)
            for pat,repl in reps: text=re.sub(pat,repl,text,flags=re.I|re.S)
            text=text.replace('\\A Operação comercial e pagamentos: Guiropa World™.','\\A Operação comercial e pagamentos: Passport Radio.')
            text=text.replace('\\A Operação comercial e pagamentos: Guiropa World.','\\A Operação comercial e pagamentos: Passport Radio.')
            if text!=old: p.write_text(text,encoding='utf-8'); changed.append(str(p))
          leftovers=[]
          for p in files:
            if not p.is_file(): continue
            try: text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            if OLD in text: leftovers.append(f'{p}: legacy Asaas URL')
            if re.search(r'(Operação|pagamentos|Recebimentos|CNPJ)[^\n<]{0,120}Guiropa|Guiropa[^\n<]{0,120}(Operação|pagamentos|Recebimentos|CNPJ)',text,re.I): leftovers.append(f'{p}: Guiropa payment/legal identity')
          if leftovers: raise SystemExit('Guardrail failed:\n'+'\n'.join(leftovers))
          print('Changed files:\n'+'\n'.join(changed))
      - name: Commit migration
        run: |
          git config user.name "Passport Radio Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git rm .github/workflows/passport-asaas-migration.yml
          git commit -m "Move Passport support payments off Guiropa"
          git push origin HEAD:fix/passport-asaas-identity
