name: Passport Editorial Engine — Full Story 500/day

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stage = artifact only; pr = rolling review PR; direct = publish to main"
        required: false
        default: "direct"
        type: choice
        options: [stage, pr, direct]
      daily_target:
        description: "Publications per day (1-700)"
        required: false
        default: "500"
      force_batch:
        description: "Manual batch override (-1 uses pacing; 0-12 overrides)"
        required: false
        default: "-1"
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: read
  copilot-requests: write

concurrency:
  group: passport-editorial-engine
  cancel-in-progress: false

jobs:
  build-editorial:
    name: Build Passport Full Story editorial batch
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PERSONAL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PASSPORT_EDITORIAL_MODEL: auto

    steps:
      - name: Checkout Passport main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@latest
      - name: Resolve engine mode and target
        id: settings
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"; TARGET="${{ github.event.inputs.daily_target }}"; FORCE="${{ github.event.inputs.force_batch }}"
          if [ -z "$MODE" ]; then MODE="${{ vars.PASSPORT_EDITORIAL_MODE }}"; fi
          if [ -z "$MODE" ]; then MODE="direct"; fi
          if [ -z "$TARGET" ]; then TARGET="500"; fi
          if [ -z "$FORCE" ]; then FORCE="-1"; fi
          case "$MODE" in stage|pr|direct) ;; *) echo "Invalid mode: $MODE"; exit 2;; esac
          if [ "$TARGET" -lt 1 ] || [ "$TARGET" -gt 700 ]; then echo "daily_target must be 1..700"; exit 2; fi
          if [ "$FORCE" -lt -1 ] || [ "$FORCE" -gt 12 ]; then echo "force_batch must be -1..12"; exit 2; fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"; echo "TARGET=$TARGET" >> "$GITHUB_ENV"; echo "FORCE=$FORCE" >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Full Story: $TARGET/day · capacity 700/day · max batch 12 · final language pt-BR" >> "$GITHUB_STEP_SUMMARY"
      - name: Locate latest Global Editorial Tunnel packet
        id: tunnel
        shell: bash
        run: |
          mkdir -p build/tunnel-download
          RUN_ID="$(gh run list --workflow editorial-tunnel.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$RUN_ID" ]; then gh run download "$RUN_ID" --dir build/tunnel-download || true; fi
          QUEUE="$(find build/tunnel-download -type f -name editorial-daily.json -print -quit 2>/dev/null || true)"
          if [ -z "$QUEUE" ]; then
            mkdir -p build/editorial-tunnel
            python tools/editorial_tunnel_global.py --sources data/editorial-sources-global.json --output-dir build/editorial-tunnel --daily-limit 1200 --per-source 20 --max-age-hours 96 --workers 24
            QUEUE="build/editorial-tunnel/editorial-daily.json"
          fi
          echo "queue=$QUEUE" >> "$GITHUB_OUTPUT"
      - name: Run Full Story editorial batch
        shell: bash
        run: |
          APPLY=""; if [ "$MODE" = "pr" ] || [ "$MODE" = "direct" ]; then APPLY="--apply"; fi
          mkdir -p build/editorial-engine
          python tools/editorial_engine_copilot.py --queue "${{ steps.tunnel.outputs.queue }}" --config data/editorial-engine.json --state data/editorial-published.json --feed data/editorial-feed.json --output-dir build/editorial-engine --daily-target "$TARGET" --capacity 700 --max-batch 12 --force-batch "$FORCE" $APPLY | tee build/editorial-engine-console.json
      - name: Add engine report to summary
        if: always()
        shell: bash
        run: |
          if [ -f build/editorial-engine/engine-report.json ]; then python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path('build/editorial-engine/engine-report.json').read_text('utf-8'))
          print('\n## Passport Editorial Engine™ — Full Story')
          print(f"Status: **{d.get('status')}** · requested: **{d.get('requested_batch',0)}** · generated: **{len(d.get('generated',[]))}**")
          print(f"Published today: **{d.get('published_today_after',d.get('already_today',0))}/{d.get('daily_target',500)}**")
          for item in d.get('generated',[])[:12]: print(f"- {item.get('format')} · {item.get('category')} · {item.get('title')}")
          PY
          fi
      - name: Upload editorial build packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-editorial-engine-${{ github.run_number }}
          path: |
            build/editorial-engine/
            build/editorial-engine-console.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish direct Full Story batch
        if: steps.settings.outputs.mode == 'direct'
        shell: bash
        run: |
          git config user.name "Passport Radio Editorial Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml data/editorial-feed.json data/editorial-published.json editorial/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "No editorial story generated; nothing to publish." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -m "Passport Editorial Full Story: publish automatic batch"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce truthful editorial health
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/editorial-engine/engine-report.json')
          if not p.exists(): raise SystemExit('Editorial Engine produced no engine report')
          d=json.loads(p.read_text('utf-8')); requested=int(d.get('requested_batch',0)); generated=len(d.get('generated',[]))
          if requested > 0 and generated == 0: raise SystemExit('EDITORIAL BLOCKED — stories were due but generation produced zero')
          print(f'Editorial health OK: requested={requested} generated={generated} status={d.get("status")}')
          PY
