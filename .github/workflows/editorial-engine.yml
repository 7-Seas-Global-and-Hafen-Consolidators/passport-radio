name: Passport Editorial Engine — Constitution / Zero-Cost Multiprovider

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stage = artifact only; pr = rolling review PR; direct = publish to main"
        required: false
        default: "direct"
        type: choice
        options: [stage, pr, direct]
      daily_target:
        description: "Daily publication CAP (1-500; quality may publish fewer)"
        required: false
        default: "500"
      force_batch:
        description: "Manual generation budget override (-1 uses pacing; 0-12 overrides)"
        required: false
        default: "-1"
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-engine.yml'
      - 'tools/editorial_engine_free.py'
      - 'tools/editorial_engine_constitution.py'
      - 'tools/editorial_fact_pack.py'
      - 'tools/editorial_quality_gate.py'
      - 'data/editorial-engine.json'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: passport-editorial-engine
  cancel-in-progress: false

jobs:
  build-editorial:
    name: Build Passport quality-first editorial batch — zero-cost multiprovider
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_FREE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_FREE_API_KEY }}
      PASSPORT_GROQ_MODEL: openai/gpt-oss-120b
      PASSPORT_GEMINI_MODEL: gemini-2.5-flash-lite
      PASSPORT_OPENROUTER_MODEL: openrouter/free
      PASSPORT_OLLAMA_MODEL: qwen2.5:1.5b-instruct
      PASSPORT_OLLAMA_URL: http://127.0.0.1:11434/api/chat
      PASSPORT_OLLAMA_TIMEOUT: '300'
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: 8192
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Passport main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Freeze editorial day
        shell: bash
        run: |
          STARTED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DAY="$(TZ=America/Sao_Paulo date +'%Y-%m-%d')"
          echo "PASSPORT_RUN_STARTED_AT=$STARTED" >> "$GITHUB_ENV"
          echo "PASSPORT_EDITORIAL_DAY=$DAY" >> "$GITHUB_ENV"
          echo "Editorial day frozen at **$DAY** · run start **$STARTED**" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve engine mode and publication cap
        id: settings
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"; TARGET="${{ github.event.inputs.daily_target }}"; FORCE="${{ github.event.inputs.force_batch }}"
          if [ -z "$MODE" ]; then MODE="${{ vars.PASSPORT_EDITORIAL_MODE }}"; fi
          if [ -z "$MODE" ]; then MODE="direct"; fi
          if [ -z "$TARGET" ]; then TARGET="500"; fi
          if [ -z "$FORCE" ]; then FORCE="-1"; fi
          if [ "$FORCE" = "-1" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then FORCE="1"; fi
          if [ "$FORCE" = "-1" ] && [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then FORCE="4"; fi
          case "$MODE" in stage|pr|direct) ;; *) echo "Invalid mode: $MODE"; exit 2;; esac
          if [ "$TARGET" -lt 1 ] || [ "$TARGET" -gt 500 ]; then echo "daily publication cap must be 1..500"; exit 2; fi
          if [ "$FORCE" -lt -1 ] || [ "$FORCE" -gt 12 ]; then echo "force_batch must be -1..12"; exit 2; fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"; echo "TARGET=$TARGET" >> "$GITHUB_ENV"; echo "FORCE=$FORCE" >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Quality-first: up to $TARGET publications/day · 1200 deterministic evaluation cap · generation budget 12/run · pt-BR · zero-cost cascade · Fact Pack + enforced quality gate" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile Constitution and run Golden Corpus
        shell: bash
        run: |
          python -m py_compile tools/editorial_engine.py tools/editorial_engine_constitution.py tools/editorial_fact_pack.py tools/editorial_quality_gate.py tools/editorial_engine_free.py
          python tests/test_editorial_constitution.py
      - name: Prepare local zero-key inference fallback
        if: env.GROQ_API_KEY == '' && env.GEMINI_API_KEY == '' && env.OPENROUTER_API_KEY == ''
        shell: bash
        run: |
          free -m || true
          OLLAMA_INSTALL_URL="https://github.com/ollama/ollama/releases/download/v0.33.1/install.sh"
          OLLAMA_INSTALL_SHA256="25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f"
          curl -fsSL "$OLLAMA_INSTALL_URL" -o /tmp/passport-ollama-install.sh
          echo "$OLLAMA_INSTALL_SHA256  /tmp/passport-ollama-install.sh" | sha256sum -c -
          sh /tmp/passport-ollama-install.sh
          nohup ollama serve > /tmp/passport-ollama.log 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/passport-ollama.log || true; exit 1; fi
          ollama pull "$PASSPORT_OLLAMA_MODEL"
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          free -m || true
          echo "Local zero-key fallback ready: $PASSPORT_OLLAMA_MODEL · Ollama v0.33.1 installer checksum verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Locate latest Global Editorial Tunnel packet
        id: tunnel
        shell: bash
        run: |
          mkdir -p build/tunnel-download
          RUN_ID="$(gh run list --workflow editorial-tunnel.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$RUN_ID" ]; then gh run download "$RUN_ID" --dir build/tunnel-download || true; fi
          QUEUE="$(find build/tunnel-download -type f -name editorial-daily.json -print -quit 2>/dev/null || true)"
          if [ -z "$QUEUE" ]; then
            mkdir -p build/editorial-tunnel
            python tools/editorial_tunnel_global.py --sources data/editorial-sources-global.json --output-dir build/editorial-tunnel --daily-limit 1200 --per-source 20 --max-age-hours 96 --workers 24
            QUEUE="build/editorial-tunnel/editorial-daily.json"
          fi
          echo "queue=$QUEUE" >> "$GITHUB_OUTPUT"
      - name: Run Constitution zero-cost multiprovider batch
        shell: bash
        run: |
          APPLY=""; if [ "$MODE" = "pr" ] || [ "$MODE" = "direct" ]; then APPLY="--apply"; fi
          mkdir -p build/editorial-engine
          python tools/editorial_engine_free.py --queue "${{ steps.tunnel.outputs.queue }}" --config data/editorial-engine.json --state data/editorial-published.json --feed data/editorial-feed.json --output-dir build/editorial-engine --publish-cap "$TARGET" --capacity 1200 --max-batch 12 --force-batch "$FORCE" $APPLY | tee build/editorial-engine-console.json
      - name: Add engine report to summary
        if: always()
        shell: bash
        run: |
          if [ -f build/editorial-engine/engine-report.json ]; then python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path('build/editorial-engine/engine-report.json').read_text('utf-8'))
          print('\n## Passport Editorial Constitution™')
          print(f"Status: **{d.get('status')}** · requested generation: **{d.get('requested_batch',0)}** · generated: **{len(d.get('generated',[]))}** · evaluated: **{d.get('evaluated',0)}**")
          print(f"Published today: **{d.get('published_today_after',d.get('already_today',0))}/{d.get('daily_publish_cap',500)} cap** · Fact Packs: **{d.get('fact_packs_created',0)}** · quality rejections: **{d.get('quality_rejections',0)}**")
          print(f"Quality gate: **{d.get('quality_gate_mode')}** · batch: **{d.get('batch_id')}** · editorial day: **{d.get('editorial_day')}**")
          for item in d.get('generated',[])[:12]: print(f"- {item.get('format')} · {item.get('category')} · {item.get('title')}")
          PY
          fi
      - name: Upload editorial build packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: passport-editorial-engine-${{ github.run_number }}
          path: |
            build/editorial-engine/
            build/editorial-engine-console.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish direct quality-first batch
        if: steps.settings.outputs.mode == 'direct'
        shell: bash
        run: |
          git config user.name "Passport Radio Editorial Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml data/editorial-feed.json data/editorial-published.json editorial/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "No approved editorial story generated; nothing to publish." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          BATCH_ID="$(python -c "import json; print(json.load(open('build/editorial-engine/engine-report.json')).get('batch_id','unknown'))")"
          git commit -m "Passport Editorial Constitution: publish batch $BATCH_ID"
          git fetch origin main --depth=50
          git rebase origin/main
          git push origin HEAD:main
      - name: Enforce truthful editorial health
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/editorial-engine/engine-report.json')
          if not p.exists(): raise SystemExit('Editorial Engine produced no engine report')
          d=json.loads(p.read_text('utf-8'))
          status=str(d.get('status') or '')
          allowed={'HEALTHY','HEALTHY_CAP_REACHED','QUALITY_LIMITED','DEGRADED'}
          if status == 'BLOCKED': raise SystemExit(f"EDITORIAL BLOCKED — {d.get('block_reason','generation path unavailable')}")
          if status not in allowed: raise SystemExit(f'EDITORIAL INVALID STATE — {status}')
          print(f"Editorial health truthful: status={status} generated={len(d.get('generated',[]))} evaluated={d.get('evaluated',0)}")
          PY
