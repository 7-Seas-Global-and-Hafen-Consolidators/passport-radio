name: Passport Newsroom — Confidence Validation

on:
  pull_request:
    paths:
      - 'tools/editorial_story_enricher.py'
      - 'tools/newsroom_editorial_confidence.py'
      - 'tools/newsroom_canary_runner.py'
      - 'tools/newsroom_placement_audit.py'
      - 'tests/test_newsroom_media_golden.py'
      - 'tests/test_newsroom_placement_audit.py'
      - 'ops/canary/*.json'
      - '.github/workflows/editorial-story-enrichment.yml'
      - '.github/workflows/newsroom-confidence-validation.yml'

permissions:
  contents: read

jobs:
  validate-newsroom-confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Newsroom confidence code
        run: python -m py_compile tools/editorial_story_enricher.py tools/newsroom_editorial_confidence.py tools/newsroom_canary_runner.py tools/newsroom_placement_audit.py tests/test_newsroom_media_golden.py tests/test_newsroom_placement_audit.py
      - name: Run Newsroom golden set
        run: python tests/test_newsroom_media_golden.py
      - name: Run placement audit golden set
        run: python tests/test_newsroom_placement_audit.py
      - name: Validate historical Canary 002 manifest
        run: python tools/newsroom_canary_runner.py --manifest ops/canary/canary-002.json --run-id "pr-${{ github.run_id }}-legacy" --validate-only
      - name: Validate active Canary 003 manifest
        run: python tools/newsroom_canary_runner.py --manifest ops/canary/canary-003.json --run-id "pr-${{ github.run_id }}" --validate-only
      - name: Validate placement audit Canary 001 manifest
        run: python -c "import json,pathlib; p=pathlib.Path('ops/canary/placement-audit-001.json'); d=json.loads(p.read_text()); assert d['version']=='placement-audit-001'; assert d['composition_enabled'] is False; assert len(d['cases'])==5; print('PLACEMENT_AUDIT_CANARY_VALID')"
      - name: Run active Canary 003 dry-run
        run: python tools/newsroom_canary_runner.py --manifest ops/canary/canary-003.json --run-id "pr-${{ github.run_id }}" --dry-run
      - name: Preserve validation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-newsroom-validation-audit-${{ github.run_id }}
          path: build/newsroom-audit/
          retention-days: 14
          if-no-files-found: warn
