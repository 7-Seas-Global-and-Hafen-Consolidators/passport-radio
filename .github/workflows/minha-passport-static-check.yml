name: Minha Passport Static Check
on:
  pull_request:
    paths:
      - 'minha-passport.html'
      - 'js/passport-auth.js'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/minha-passport-static-check.mjs
