name: Minha Passport Postdeploy
on:
  push:
    branches: [main]
    paths:
      - 'minha-passport.html'
      - 'js/passport-auth.js'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sleep 60
      - run: node tests/minha-passport-live-probe.mjs
