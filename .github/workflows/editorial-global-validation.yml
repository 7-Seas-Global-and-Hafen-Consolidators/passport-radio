name: Validate Global Editorial Engine

on:
  pull_request:
    paths:
      - '.github/workflows/editorial-engine.yml'
      - '.github/workflows/editorial-tunnel.yml'
      - '.github/workflows/editorial-global-validation.yml'
      - 'tools/editorial_engine.py'
      - 'tools/editorial_engine_copilot.py'
      - 'tools/editorial_engine_free.py'
      - 'tools/editorial_engine_constitution.py'
      - 'tools/editorial_fact_pack.py'
      - 'tools/editorial_quality_gate.py'
      - 'tests/test_editorial_constitution.py'
      - 'tools/editorial_tunnel.py'
      - 'tools/editorial_tunnel_global.py'
      - 'data/editorial-engine.json'
      - 'data/editorial-sources-global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile editorial Python
        run: |
          python -m py_compile \
            tools/editorial_engine.py \
            tools/editorial_engine_copilot.py \
            tools/editorial_engine_free.py \
            tools/editorial_engine_constitution.py \
            tools/editorial_fact_pack.py \
            tools/editorial_quality_gate.py \
            tools/editorial_tunnel.py \
            tools/editorial_tunnel_global.py
          python tests/test_editorial_constitution.py
      - name: Validate worldwide quality-first operating policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          cfg=json.loads(Path('data/editorial-engine.json').read_text('utf-8'))
          src=json.loads(Path('data/editorial-sources-global.json').read_text('utf-8'))
          sources=src.get('sources', [])
          workflow=Path('.github/workflows/editorial-engine.yml').read_text('utf-8')
          launcher=Path('tools/editorial_engine_free.py').read_text('utf-8')
          constitution=Path('tools/editorial_engine_constitution.py').read_text('utf-8')
          factpack=Path('tools/editorial_fact_pack.py').read_text('utf-8')
          quality=Path('tools/editorial_quality_gate.py').read_text('utf-8')
          global_tunnel_text=Path('tools/editorial_tunnel_global.py').read_text('utf-8')

          # Constitution v8: 500 is a publication ceiling and the gate is authoritative.
          assert cfg['version'] >= 8, cfg
          assert cfg['daily_publish_cap'] == 500, cfg
          assert cfg['daily_target'] == 500, cfg
          assert cfg['daily_evaluation_cap'] == 1200, cfg
          assert cfg['daily_capacity'] == 700, cfg
          assert cfg['max_batch'] == 12, cfg
          assert cfg['generation_call_budget_per_run'] == 12, cfg
          assert cfg['evaluation_scan_per_run'] >= 24, cfg
          assert cfg['model'] == 'auto', cfg
          assert cfg['quality_gate']['mode'] == 'enforce', cfg
          assert cfg['quality_gate']['require_fact_refs'] is True, cfg
          assert cfg['quality_gate']['require_ptbr'] is True, cfg
          assert cfg['quality_gate']['anti_copy_window_words'] >= 40, cfg
          assert cfg['minimum_words']['STORY'] >= 850, cfg
          assert cfg['minimum_words']['MR_NOMAD'] >= 1100, cfg
          assert len(sources) >= 120, len(sources)

          keys=[(x.get('domain'), x.get('url')) for x in sources]
          assert len(keys) == len(set(keys)), 'duplicate source domain/url pairs'
          required_regions={'brasil','latin_america','central_america','caribbean','uk_ireland','continental_europe','nordics','eastern_europe','east_asia','south_asia','southeast_asia','central_asia','middle_east','africa','oceania','north_america'}
          present={cat for s in sources for cat in s.get('categories', [])}
          missing=required_regions-present
          assert not missing, f'missing regions: {sorted(missing)}'

          sys.path.insert(0, str(Path('tools').resolve()))
          import editorial_engine_constitution as engine
          import editorial_fact_pack as fp
          import editorial_engine_free as free
          import editorial_tunnel as base_tunnel
          import editorial_tunnel_global as global_tunnel

          assert engine.PUBLICATION_HARD_CAP == 500
          assert engine.EVALUATION_HARD_CAP >= 1200
          assert engine.MAX_BATCH_HARD_CAP == 12

          assert "cron: '2,12,22,32,42,52 * * * *'" in workflow
          assert 'default: "500"' in workflow
          assert 'daily publication cap must be 1..500' in workflow
          assert 'force_batch must be -1..12' in workflow
          assert '--publish-cap "$TARGET"' in workflow
          assert '--capacity 1200' in workflow
          assert '--max-batch 12' in workflow
          assert 'fetch-depth: 1' in workflow
          assert 'Freeze editorial day' in workflow
          assert 'tools/editorial_engine_free.py' in workflow
          assert 'PASSPORT_GROQ_MODEL: openai/gpt-oss-120b' in workflow
          assert 'PASSPORT_GEMINI_MODEL: gemini-2.5-flash-lite' in workflow
          assert 'PASSPORT_OPENROUTER_MODEL: openrouter/free' in workflow
          assert 'PASSPORT_OLLAMA_MODEL: qwen2.5:1.5b-instruct' in workflow
          assert "PASSPORT_OLLAMA_TIMEOUT: '300'" in workflow
          assert 'OLLAMA_CONTEXT_LENGTH: 8192' in workflow
          assert 'Fact Pack + enforced quality gate' in workflow
          assert 'QUALITY_LIMITED' in workflow
          assert 'EDITORIAL BLOCKED' in workflow

          # Publication must never rebase generated shared state over a newer main.
          assert 'group: passport-editorial-engine' in workflow
          assert 'EDITORIAL PUBLISH DEFERRED' in workflow
          assert 'BASE_SHA="$(git rev-parse HEAD)"' in workflow
          assert 'REMOTE_SHA="$(git rev-parse origin/main)"' in workflow
          assert 'git rebase origin/main' not in workflow

          # Supply chain is pinned; floating install script is forbidden.
          assert 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' in workflow
          assert 'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065' in workflow
          assert 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' in workflow
          assert 'ollama/ollama/releases/download/v0.33.1/install.sh' in workflow
          assert '25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f' in workflow
          assert 'sha256sum -c -' in workflow
          assert 'curl -fsSL https://ollama.com/install.sh | sh' not in workflow

          # Zero-cost launcher keeps Phase 2 dynamic structured provenance intact.
          assert 'editorial_engine_constitution' in launcher
          assert 'engine.MAX_BATCH_HARD_CAP = 12' in launcher
          assert 'groq-free' in launcher and 'gemini-free' in launcher and 'openrouter-free' in launcher
          assert 'ollama-local-zero-key' in launcher
          assert 'openrouter/free' in launcher and 'endswith(":free")' in launcher
          assert 'all_free_providers_exhausted' in launcher
          assert 'circuit_breaker' in launcher
          assert 'provider_runtime_snapshot' in launcher
          assert '_structured_output_schema' in launcher
          assert '_safe_fact_ids' in launcher
          assert '"enum": valid_ids' in launcher
          assert '"minItems": 1' in launcher

          # Constitution + Fact Pack + quality gate contracts.
          for marker in ('story_angle_id','event_id','batch_id','fact_refs','QUALITY_LIMITED','BLOCKED','fact-packs.json','shadow-decisions.json'):
              assert marker in constitution, marker
          assert 'generation_view(pack)' in constitution
          assert 'quality_gate.evaluate' in constitution
          assert 'Source Firewall' in factpack
          assert 'generation_view' in factpack
          assert 'WOULD_PUBLISH' in quality and 'WOULD_REJECT' in quality and 'WOULD_REPROCESS' in quality
          assert 'public_language_not_ptbr' in quality
          assert 'schema_placeholder_echo' in quality
          assert 'unverified_numbers' in quality
          assert 'unverified_literal_quote' in quality

          sample_candidate={'title':'Iron Maiden anuncia show no Brasil','description':'A banda confirmou nova apresentação para outubro de 2026.','url':'https://example.invalid/a','primary_category':'metal','recommended_format':'STORY','published':'2026-08-27'}
          pack=fp.build_fact_pack(sample_candidate, 'A banda confirmou a apresentação para 12 de outubro de 2026.', '2026-08-27')
          view=fp.generation_view(pack)
          dumped=json.dumps(view, ensure_ascii=False)
          assert 'https://' not in dumped and 'source_name' not in dumped, dumped
          assert pack['event_id'].startswith('EVT_') and pack['story_angle_id'].startswith('ANG_')
          sample_candidate['_fact_pack']=pack
          schema=free._structured_output_schema(sample_candidate)
          refs=schema['properties']['sections']['items']['properties']['paragraphs']['items']['properties']['fact_refs']
          assert refs['minItems'] == 1 and refs['items']['enum']

          assert 'inject_amazon_affiliate.py' not in workflow
          assert 'Inject Amazon affiliate layer' not in workflow
          assert "git add -- '*.html'" not in workflow
          assert "git add index.html sitemap.xml data/editorial-feed.json data/editorial-published.json editorial/" in workflow

          sample={'title':'Teste Passport','meta_description':'Teste','deck':'Teste','published_at':'2026-08-27T12:00:00-03:00','category':'rock','format':'STORY','kicker':'PASSPORT RADIO · ROCK · 27/08/2026','sections':[{'heading':'Teste','paragraphs':[{'text':'Parágrafo editorial de teste suficientemente longo para renderização.','fact_refs':['FTEST']}]}],'closing':'Fecho editorial.','story_angle_id':'ANG_TEST','batch_id':'batch-test'}
          rendered=engine.render_article(sample, '/editorial/teste.html', [])
          assert '<html lang="pt-BR">' in rendered
          assert 'pe-nomad-signature' in rendered
          assert 'MR. NOMAD' in rendered
          assert 'passport:story-id' in rendered
          assert 'passport:batch-id' in rendered
          assert 'Every Song Is A Destination.' in rendered

          # Protected worldwide Tunnel remains unchanged: 1200 radar / 24 workers.
          for lang in ('es','fr','de','it','ja','ko','zh-CN','ar','tr','ru'):
              assert lang in engine.GLOBAL_ACCEPT_LANGUAGE, lang
              assert lang in base_tunnel.GLOBAL_ACCEPT_LANGUAGE, lang
          assert engine.tokens('東京 음악 музыка موسيقى')
          assert base_tunnel.DAILY_RESERVOIR_HARD_CAP >= 1200
          assert base_tunnel.PER_SOURCE_HARD_CAP >= 20
          assert base_tunnel.WORKERS_HARD_CAP >= 24
          assert base_tunnel.RADAR_HARD_CAP >= 1200
          assert global_tunnel.GLOBAL_DAILY_RESERVOIR >= 1200
          assert global_tunnel.GLOBAL_PER_SOURCE_CAP >= 20
          assert global_tunnel.SOURCE_SELECTION_CAP >= 10
          assert 'raise_base_limits' not in global_tunnel_text
          assert 'co_consts' not in global_tunnel_text

          forbidden=cfg.get('public_forbidden_patterns', [])
          assert forbidden and len(forbidden) >= 10
          print(f'validated {len(sources)} worldwide sources; Tunnel 1200/24 preserved; publish cap 500; evaluation cap 1200; dynamic structured provenance + ENFORCED quality gate + stale-base publication guard + pinned supply chain')
          PY
