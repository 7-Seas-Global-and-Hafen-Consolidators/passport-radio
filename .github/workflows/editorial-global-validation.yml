name: Validate Global Editorial Engine

on:
  pull_request:
    paths:
      - '.github/workflows/editorial-engine.yml'
      - '.github/workflows/editorial-tunnel.yml'
      - '.github/workflows/editorial-global-validation.yml'
      - 'tools/editorial_engine.py'
      - 'tools/editorial_engine_copilot.py'
      - 'tools/editorial_engine_free.py'
      - 'tools/editorial_tunnel.py'
      - 'tools/editorial_tunnel_global.py'
      - 'data/editorial-engine.json'
      - 'data/editorial-sources-global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile editorial Python
        run: |
          python -m py_compile \
            tools/editorial_engine.py \
            tools/editorial_engine_copilot.py \
            tools/editorial_engine_free.py \
            tools/editorial_tunnel.py \
            tools/editorial_tunnel_global.py
      - name: Validate worldwide Full Story 500/day operating policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          cfg=json.loads(Path('data/editorial-engine.json').read_text('utf-8'))
          src=json.loads(Path('data/editorial-sources-global.json').read_text('utf-8'))
          sources=src.get('sources', [])
          workflow=Path('.github/workflows/editorial-engine.yml').read_text('utf-8')
          launcher=Path('tools/editorial_engine_free.py').read_text('utf-8')
          global_tunnel_text=Path('tools/editorial_tunnel_global.py').read_text('utf-8')

          # Operation 26/8: 500 public stories/day, 700/day internal capacity, 12/run.
          assert cfg['version'] >= 6, cfg
          assert cfg['daily_target'] == 500, cfg
          assert cfg['daily_capacity'] == 700, cfg
          assert cfg['max_batch'] == 12, cfg
          assert cfg['generation_call_budget_per_run'] == 12, cfg
          assert cfg['model'] == 'auto', cfg
          assert cfg['minimum_words']['STORY'] >= 850, cfg
          assert cfg['minimum_words']['MR_NOMAD'] >= 1100, cfg
          assert len(sources) >= 120, len(sources)

          keys=[(x.get('domain'), x.get('url')) for x in sources]
          assert len(keys) == len(set(keys)), 'duplicate source domain/url pairs'
          required_regions={'brasil','latin_america','central_america','caribbean','uk_ireland','continental_europe','nordics','eastern_europe','east_asia','south_asia','southeast_asia','central_asia','middle_east','africa','oceania','north_america'}
          present={cat for s in sources for cat in s.get('categories', [])}
          missing=required_regions-present
          assert not missing, f'missing regions: {sorted(missing)}'

          sys.path.insert(0, str(Path('tools').resolve()))
          import editorial_engine as engine
          import editorial_tunnel as base_tunnel
          import editorial_tunnel_global as global_tunnel

          assert engine.PUBLICATION_HARD_CAP >= 700
          assert engine.RESERVOIR_HARD_CAP >= 700
          assert engine.MAX_BATCH_HARD_CAP >= 12

          # Workflow contract: every 10 minutes, default 500/day, capacity 700, max batch 12.
          assert "cron: '2,12,22,32,42,52 * * * *'" in workflow
          assert 'default: "500"' in workflow
          assert 'TARGET="500"' in workflow
          assert 'daily_target must be 1..700' in workflow
          assert 'force_batch must be -1..12' in workflow
          assert '--capacity 700' in workflow
          assert '--max-batch 12' in workflow
          assert 'tools/editorial_engine_free.py' in workflow
          assert 'PASSPORT_GROQ_MODEL: openai/gpt-oss-120b' in workflow
          assert 'PASSPORT_GEMINI_MODEL: gemini-2.5-flash-lite' in workflow
          assert 'PASSPORT_OPENROUTER_MODEL: openrouter/free' in workflow
          assert 'Full Story' in workflow
          assert 'Enforce truthful editorial health' in workflow
          assert 'EDITORIAL BLOCKED' in workflow

          # Free generator keeps the 12-story batch and zero-cost cascade contract.
          assert 'min(12' in launcher
          assert 'groq-free' in launcher
          assert 'gemini-free' in launcher
          assert 'openrouter-free' in launcher
          assert 'openrouter/free' in launcher
          assert 'endswith(":free")' in launcher
          assert 'all_free_providers_exhausted' in launcher

          # Editorial automation remains isolated from commercial/site-wide mutation.
          assert 'inject_amazon_affiliate.py' not in workflow
          assert 'Inject Amazon affiliate layer' not in workflow
          assert "git add -- '*.html'" not in workflow
          assert "git add index.html sitemap.xml data/editorial-feed.json data/editorial-published.json editorial/" in workflow

          # Renderer remains public pt-BR and keeps the Passport/Mr. Nomad signature.
          sample={'title':'Teste Passport','meta_description':'Teste','deck':'Teste','published_at':'2026-08-26T12:00:00-03:00','category':'rock','format':'STORY','kicker':'PASSPORT RADIO · ROCK · 26/08/2026','sections':[],'closing':'Fecho editorial.'}
          rendered=engine.render_article(sample, '/editorial/teste.html', [])
          assert '<html lang="pt-BR">' in rendered
          assert 'pe-nomad-signature' in rendered
          assert 'MR. NOMAD' in rendered
          assert 'Every Song Is A Destination.' in rendered

          # Worldwide multilingual discovery remains intact; public output is normalized later.
          for lang in ('es','fr','de','it','ja','ko','zh-CN','ar','tr','ru'):
              assert lang in engine.GLOBAL_ACCEPT_LANGUAGE, lang
              assert lang in base_tunnel.GLOBAL_ACCEPT_LANGUAGE, lang
          assert engine.tokens('東京 음악 музыка موسيقى')
          assert base_tunnel.DAILY_RESERVOIR_HARD_CAP >= 1200
          assert base_tunnel.PER_SOURCE_HARD_CAP >= 20
          assert base_tunnel.WORKERS_HARD_CAP >= 24
          assert base_tunnel.RADAR_HARD_CAP >= 1200
          assert global_tunnel.GLOBAL_DAILY_RESERVOIR >= 1200
          assert global_tunnel.GLOBAL_PER_SOURCE_CAP >= 20
          assert global_tunnel.SOURCE_SELECTION_CAP >= 10
          assert 'raise_base_limits' not in global_tunnel_text
          assert 'co_consts' not in global_tunnel_text

          forbidden=cfg.get('public_forbidden_patterns', [])
          assert forbidden and len(forbidden) >= 10
          print(f'validated {len(sources)} worldwide sources; 1200-signal radar / 500 public per day / 700 capacity / 12 per run / Full Story pt-BR / free multiprovider')
          PY
