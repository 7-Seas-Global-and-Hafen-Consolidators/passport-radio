name: Minha Passport Placeholder Guard
on:
  pull_request:
    paths: ['minha-passport.html']
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/minha-passport-placeholder-check.mjs
