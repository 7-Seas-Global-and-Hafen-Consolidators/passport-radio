name: Passport Editorial Tunnel Global — 1200

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/editorial-tunnel.yml'
      - 'tools/editorial_tunnel_resilient.py'
      - 'data/editorial-rss-overrides.json'
      - 'data/editorial-sources-mena.json'
      - 'data/editorial-sources-east-africa.json'
      - 'tests/test_editorial_tunnel_rss_fallback.py'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: passport-editorial-tunnel
  cancel-in-progress: true

jobs:
  excavate:
    name: Excavate worldwide editorial signals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Passport
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate resilient RSS fallback
        run: |
          python -m py_compile tools/editorial_tunnel_resilient.py
          python tests/test_editorial_tunnel_rss_fallback.py
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('data/editorial-rss-overrides.json').read_text('utf-8'))
          assert cfg.get('version', 0) >= 3
          feeds=cfg.get('feeds') or {}
          landings=cfg.get('landing_urls') or {}
          assert feeds.get('whiplash.net') == ['https://whiplash.net/feeds/news.xml']
          assert feeds.get('news.howofwhat.com') == ['https://news.howofwhat.com/rss/category/music']
          assert landings.get('metal.it') == 'https://www.metal.it/'
          assert landings.get('stormbringer.at') == 'https://stormbringer.at/news'
          assert landings.get('jame-world.com') == 'https://www.jame-world.com/en/news'
          assert landings.get('telemetro.com') == 'https://www.telemetro.com/entretenimiento/musica'
          print('editorial_source_overrides: PASS')
          PY
      - name: Build effective source map
        run: |
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          source_path=Path('data/editorial-sources-global.json')
          regional_paths=[Path('data/editorial-sources-mena.json'),Path('data/editorial-sources-east-africa.json')]
          override_path=Path('data/editorial-rss-overrides.json')
          output_path=Path('build/editorial-sources-effective.json')
          data=json.loads(source_path.read_text('utf-8'))
          existing={str(x.get('domain') or '').lower().removeprefix('www.') for x in data.get('sources', [])}
          regional_added={}
          for regional_path in regional_paths:
              regional=json.loads(regional_path.read_text('utf-8'))
              added=[]
              for source in regional.get('sources', []):
                  domain=str(source.get('domain') or '').lower().removeprefix('www.')
                  if domain and domain not in existing:
                      data.setdefault('sources', []).append(source)
                      existing.add(domain)
                      added.append(source.get('name'))
              regional_added[regional_path.name]=added
          cfg=json.loads(override_path.read_text('utf-8'))
          landing={str(k).lower().removeprefix('www.'): str(v) for k,v in (cfg.get('landing_urls') or {}).items()}
          applied=[]
          for source in data.get('sources', []):
              domain=str(source.get('domain') or '').lower().removeprefix('www.')
              replacement=landing.get(domain)
              if replacement and replacement != source.get('url'):
                  applied.append({'name': source.get('name'), 'from': source.get('url'), 'to': replacement})
                  source['url']=replacement
          output_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          print(json.dumps({'regional_sources_added': regional_added, 'source_url_overrides_applied': len(applied), 'overrides': applied}, ensure_ascii=False))
          PY
      - name: Run Worldwide Editorial Tunnel
        run: |
          python tools/editorial_tunnel_resilient.py \
            --sources build/editorial-sources-effective.json \
            --output-dir build/editorial-tunnel \
            --daily-limit 1200 \
            --per-source 20 \
            --max-age-hours 96 \
            --workers 24
      - name: Add compact radar summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          radar=Path('build/editorial-tunnel/editorial-radar.json')
          daily=Path('build/editorial-tunnel/editorial-daily.json')
          print('## Passport Editorial Tunnel™ — Worldwide 1200')
          if radar.exists():
              r=json.loads(radar.read_text('utf-8'))
              health=r.get('source_health', [])
              ok=sum(1 for x in health if x.get('ok'))
              rss=sum(1 for x in health if x.get('ok') and x.get('method') == 'rss')
              bad=[x for x in health if not x.get('ok')]
              print(f"Sources responding: **{ok}/{len(health)}** · RSS/Atom recovered: **{rss}** · still unavailable: **{len(bad)}**")
              print(f"URLs discovered: **{r.get('discovered_url_count',0)}** · article metadata: **{r.get('article_metadata_count',0)}** · clusters: **{r.get('cluster_count',0)}**")
              if bad:
                  print('Still unavailable: ' + ', '.join(x.get('name','?') for x in bad[:20]))
          if daily.exists():
              d=json.loads(daily.read_text('utf-8'))
              selected=d.get('selected', [])
              print(f"Selected reservoir: **{len(selected)}/{d.get('target',1200)}**")
              for item in selected[:12]:
                  print(f"- {item.get('primary_category','music')} · score {item.get('total_score',0)} · {item.get('title','')}")
          PY
      - name: Upload private editorial packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-editorial-tunnel-${{ github.run_number }}
          path: build/editorial-tunnel/
          retention-days: 7
          if-no-files-found: warn
