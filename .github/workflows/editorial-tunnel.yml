name: Passport Editorial Tunnel Global — 1200

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/editorial-tunnel.yml'
      - 'tools/editorial_tunnel_resilient.py'
      - 'data/editorial-rss-overrides.json'
      - 'tests/test_editorial_tunnel_rss_fallback.py'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: passport-editorial-tunnel
  cancel-in-progress: true

jobs:
  excavate:
    name: Excavate worldwide editorial signals
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Passport
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate resilient RSS fallback
        run: |
          python -m py_compile tools/editorial_tunnel_resilient.py
          python tests/test_editorial_tunnel_rss_fallback.py

      - name: Run Worldwide Editorial Tunnel
        run: |
          python tools/editorial_tunnel_resilient.py \
            --sources data/editorial-sources-global.json \
            --output-dir build/editorial-tunnel \
            --daily-limit 1200 \
            --per-source 20 \
            --max-age-hours 96 \
            --workers 24

      - name: Add compact radar summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          radar=Path('build/editorial-tunnel/editorial-radar.json')
          daily=Path('build/editorial-tunnel/editorial-daily.json')
          print('## Passport Editorial Tunnel™ — Worldwide 1200')
          if radar.exists():
              r=json.loads(radar.read_text('utf-8'))
              health=r.get('source_health', [])
              ok=sum(1 for x in health if x.get('ok'))
              rss=sum(1 for x in health if x.get('ok') and x.get('method') == 'rss')
              bad=[x for x in health if not x.get('ok')]
              print(f"Sources responding: **{ok}/{len(health)}** · RSS/Atom recovered: **{rss}** · still unavailable: **{len(bad)}**")
              print(f"URLs discovered: **{r.get('discovered_url_count',0)}** · article metadata: **{r.get('article_metadata_count',0)}** · clusters: **{r.get('cluster_count',0)}**")
              if bad:
                  print('Still unavailable: ' + ', '.join(x.get('name','?') for x in bad[:20]))
          if daily.exists():
              d=json.loads(daily.read_text('utf-8'))
              selected=d.get('selected', [])
              print(f"Selected reservoir: **{len(selected)}/{d.get('target',1200)}**")
              for item in selected[:12]:
                  print(f"- {item.get('primary_category','music')} · score {item.get('total_score',0)} · {item.get('title','')}")
          PY

      - name: Upload private editorial packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-editorial-tunnel-${{ github.run_number }}
          path: build/editorial-tunnel/
          retention-days: 7
          if-no-files-found: warn
