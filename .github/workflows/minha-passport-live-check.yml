name: Minha Passport Live Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'minha-passport.html'
      - 'js/passport-auth.js'
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Pages propagation
        run: sleep 45
      - name: Probe live account page
        run: node tests/minha-passport-live.mjs
