name: Passport Global Blog Tunnel™

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "continuous discovers the recent window; backfill walks the archive into the queue without dumping the site"
        required: false
        default: "continuous"
        type: choice
        options: [continuous, backfill]
      max_generate:
        description: "Publication cap for this run (0 = discover only)"
        required: false
        default: "2"
      apply:
        description: "Write Blog pages into the repo (never noticias/Home)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'tools/editorial_blog_tunnel.py'
      - 'tools/editorial_blog_discovery.py'
      - 'tools/editorial_media_resolver.py'
      - 'tools/editorial_fact_pack.py'
      - 'data/editorial-sources-blog-v1.json'
      - 'data/blog-tunnel-engine.json'
      - 'tests/test_editorial_blog_tunnel.py'
      - 'tests/test_editorial_blog_publication.py'
      - 'tests/test_store_stamp_pricing.py'
      - 'tests/test_circulation_publishers.py'
      - 'tools/passport_store_pricing.py'
      - 'tools/passport_circulation.py'
      - 'tools/whatsapp_channel_outbox.py'
      - 'tools/circulation_delta.py'
      - 'tools/whatsapp_channel_bridge.mjs'
      - 'tools/editorial_blog_store.py'
      - '.github/workflows/editorial-blog-tunnel.yml'
      - 'js/passport-blog-archive.js'
      - 'blog.html'
  push:
    branches: [main]
    paths:
      - 'blog/w/**.html'
      - 'data/blog-catalog.jsonl'
  schedule:
    - cron: '41 */2 * * *'

permissions:
  contents: write

concurrency:
  group: passport-blog-tunnel
  cancel-in-progress: false

jobs:
  blog-tunnel:
    name: Discover entire sources · generate a cap into the Blog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile mill + blog tunnel
        run: |
          python -m py_compile \
            tools/editorial_blog_discovery.py \
            tools/editorial_blog_tunnel.py \
            tools/editorial_blog_catalog.py \
            tools/editorial_blog_store.py \
            tools/editorial_media_resolver.py \
            tools/editorial_fact_pack.py \
            tools/editorial_quality_gate.py \
            tools/editorial_engine_constitution.py \
            tools/passport_store_pricing.py \
            tools/passport_circulation.py \
            tools/migrate_whatsapp_channel.py \
            tools/circulation_delta.py \
            tools/whatsapp_channel_outbox.py \
            tools/telegram_publisher.py \
            tools/stamp_source_crawl.py \
            tools/stamp_passport_reconcile.py
          python tests/test_editorial_blog_tunnel.py
          python tests/test_editorial_blog_publication.py
          python tests/test_store_stamp_pricing.py
          python tests/test_circulation_publishers.py
          python tools/migrate_whatsapp_channel.py
          python - <<'PY'
          from pathlib import Path
          old='https://wa.me/message/NZS7ZW4QHQVBG1'
          hits=[str(p) for p in Path('blog').rglob('*.html') if old in p.read_text('utf-8')]
          if Path('blog.html').exists() and old in Path('blog.html').read_text('utf-8'): hits.append('blog.html')
          if hits: raise SystemExit('legacy WhatsApp link remains: '+', '.join(hits[:20]))
          print('OK legacy WhatsApp Business/message URL = 0')
          PY
          node --check js/passport-blog-search.js
          node --check js/passport-blog-discussion.js
          node --check js/passport-blog-submit.js
          node --check js/passport-store-search.js
          node --check tools/whatsapp_channel_bridge.mjs

      - name: Guard protected surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          news = Path('noticias.html').read_text('utf-8')
          home = Path('index.html').read_text('utf-8')
          if 'blog-tunnel-queue.json' in news or 'editorial_blog_tunnel' in news:
              raise SystemExit('noticias.html coupled to blog tunnel')
          if 'blog-feed.json' in home:
              raise SystemExit('Home coupled to blog feed')
          print('OK protected surfaces')
          PY

      - name: Resolve run settings
        id: settings
        run: |
          MODE="${{ github.event.inputs.mode }}"
          GEN="${{ github.event.inputs.max_generate }}"
          APPLY="${{ github.event.inputs.apply }}"
          if [ -z "$MODE" ]; then MODE="continuous"; fi
          if [ -z "$GEN" ]; then GEN="2"; fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            APPLY="false"
            GEN="0"
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            APPLY="true"
            GEN="2"
            MODE="continuous"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            APPLY="true"
            GEN="0"
            MODE="continuous"
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "GEN=$GEN" >> "$GITHUB_ENV"
          echo "APPLY=$APPLY" >> "$GITHUB_ENV"

      - name: Discover entire sources into the queue
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: |
          python tools/editorial_blog_tunnel.py discover \
            --mode "$MODE" \
            --max-age-hours 168 \
            --workers 2 \
            --output-dir build/blog-tunnel

      - name: Snapshot Blog head before editorial work
        if: github.event_name != 'pull_request'
        run: echo "BLOG_BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Generate capped Blog stories
        if: github.event_name != 'pull_request' && github.event_name != 'push' && env.GEN != '0'
        run: |
          APPLY_FLAG=""
          if [ "$APPLY" = "true" ]; then APPLY_FLAG="--apply"; fi
          python tools/editorial_blog_tunnel.py generate \
            --max-generate "$GEN" \
            --output-dir build/blog-tunnel \
            $APPLY_FLAG

      - name: Normalize official WhatsApp Channel in Blog
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: python tools/migrate_whatsapp_channel.py

      - name: Refuse noticias / Home / audio writes
        if: always()
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.check_output(['git','status','--porcelain'], text=True)
          forbidden = (
              'noticias.html', 'index.html', 'radio.html',
              'data/editorial-feed.json', 'js/editorial-home.js',
              'js/passport-news.js', 'js/passport-live.js',
              '.github/workflows/editorial-engine.yml',
              '.github/workflows/editorial-tunnel.yml',
          )
          dirty = [line[3:].strip() for line in out.splitlines() if line.strip()]
          hits = [p for p in dirty if p in forbidden or p.startswith('radio-')]
          if hits:
              raise SystemExit('blog tunnel touched protected files: ' + ', '.join(hits))
          print('OK no protected writes')
          print(out or 'clean')
          PY

      - name: Commit Blog queue / sample (never merge)
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: |
          git config user.name "passport-blog-tunnel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog-tunnel-queue.json data/blog-published.json data/blog-feed.json data/blog-media-library.json data/knowledge-graph.json data/blog-catalog.jsonl data/blog-catalog-meta.json data/blog-search data/blog-tunnel-cursor.json blog.html sitemap.xml sitemap-blog.xml robots.txt
          git add blog || true
          if git diff --cached --quiet; then
            echo "No Blog publication in this run"
            exit 0
          fi
          git commit -m "chore(blog-tunnel): continuous discover + capped Blog publish"
          git push

      - name: Build complete circulation delta
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: |
          python tools/circulation_delta.py \
            --state data/circulation-state.json \
            --output build/circulation-delta.json

      - name: Queue new and revitalized Blog stories for WhatsApp Channel
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: |
          python tools/whatsapp_channel_outbox.py queue-changed \
            --catalog data/blog-catalog.jsonl \
            --outbox data/whatsapp-channel-outbox.json \
            --delta build/circulation-delta.json

      - name: Publish new and revitalized Blog stories to Telegram
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: |
          python tools/telegram_publisher.py publish-new \
            --catalog data/blog-catalog.jsonl \
            --state data/telegram-published.json \
            --delta build/circulation-delta.json

      - name: Persist WhatsApp Channel outbox
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: |
          if [ ! -f data/whatsapp-channel-outbox.json ]; then
            exit 0
          fi
          git add data/whatsapp-channel-outbox.json
          if git diff --cached --quiet; then
            echo "No WhatsApp Channel outbox change"
            exit 0
          fi
          git commit -m "chore(circulation): queue WhatsApp Channel updates"
          git push

      - name: Persist Telegram circulation state
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: |
          if [ ! -f data/telegram-published.json ]; then
            exit 0
          fi
          git add data/telegram-published.json
          if git diff --cached --quiet; then
            echo "No Telegram circulation state change"
            exit 0
          fi
          git commit -m "chore(circulation): persist Telegram publication state"
          git push

      - name: Verify circulation publishers did not silently skip
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: |
          test -f data/telegram-published.json || { echo 'FATAL: Telegram publication state absent'; exit 1; }
          test -f data/whatsapp-channel-outbox.json || { echo 'FATAL: WhatsApp Channel outbox absent'; exit 1; }

      - name: Advance circulation cursor
        if: github.event_name != 'pull_request' && env.APPLY == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/circulation-delta.json').read_text('utf-8'))
          Path('data/circulation-state.json').write_text(json.dumps({'cursor':d['to']},indent=2)+'\n','utf-8')
          PY
          git add data/circulation-state.json
          if git diff --cached --quiet; then
            echo "Circulation cursor unchanged"
            exit 0
          fi
          git commit -m "chore(circulation): advance Blog circulation cursor"
          git push

      - name: Upload private packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-blog-tunnel-${{ github.run_number }}
          path: build/blog-tunnel/
          retention-days: 7
          if-no-files-found: warn
