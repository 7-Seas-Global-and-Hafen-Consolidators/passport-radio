# Retired legacy publisher. Kept as an inert manual notice for operational clarity.
# No automatic triggers, source discovery, credentials, generation or publication.
name: Passport Global Blog Tunnel™

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Legacy Blog Tunnel retired — no publication
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain retirement
        run: |
          echo "The legacy Global Blog Tunnel is retired."
          echo "This workflow does not discover, generate, commit or publish content."
          echo "Editorial references belong to the separate private manual Radar."
