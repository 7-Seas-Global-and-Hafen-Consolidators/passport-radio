name: Materialize legacy WhatsApp purge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-whatsapp-purge.yml'
      - 'blog/**'
      - 'blog.html'
      - 'tools/migrate_whatsapp_channel.py'

permissions:
  contents: write

concurrency:
  group: materialize-whatsapp-purge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  purge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize complete purge
        run: |
          set -euo pipefail
          python tools/migrate_whatsapp_channel.py
          OLD='https://wa.me/message/NZS7ZW4QHQVBG1'
          if grep -RIl --include='*.html' "$OLD" blog blog.html 2>/dev/null | head -1 | grep -q .; then
            echo 'FATAL: legacy WhatsApp link survived'
            exit 1
          fi
          echo 'VERIFIED: legacy WhatsApp link = ZERO'
      - name: Commit materialized HTML to this PR
        run: |
          set -euo pipefail
          git config user.name 'Passport Radio Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add blog blog.html
          if git diff --cached --quiet; then
            echo 'Materialized purge already complete'
            exit 0
          fi
          git commit -m 'fix(blog): materialize WhatsApp Channel across full acervo'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
