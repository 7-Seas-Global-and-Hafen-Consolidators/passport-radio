name: Minha Passport Profile Guard
on:
  pull_request:
    paths: ['js/passport-auth.js']
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/minha-passport-profile-check.mjs
