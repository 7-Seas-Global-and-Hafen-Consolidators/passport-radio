name: Passport Light Migration

on:
  push:
    branches:
      - feature/passport-light-system-20260824

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/passport-light-system-20260824
          fetch-depth: 0

      - name: Apply Passport light entrypoint to every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          marker = 'passport-legal-footer.css?v=202608241345'
          link = f'  <link rel="stylesheet" href="/css/{marker}">\n'
          changed = []

          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              original = text

              if marker not in text and '</head>' in text.lower():
                  pos = text.lower().find('</head>')
                  text = text[:pos] + link + text[pos:]

              text = re.sub(
                  r'(<meta\s+name=["\']theme-color["\']\s+content=["\'])#[0-9A-Fa-f]{3,8}(["\'])',
                  r'\1#f7f5f0\2',
                  text,
                  flags=re.IGNORECASE,
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML pages')
          for item in changed:
              print(item)

      - name: Commit migrated pages
        run: |
          git config user.name "Passport Radio"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML migration needed"
          else
            git commit -m "Apply light editorial system to every page"
            git push origin HEAD:feature/passport-light-system-20260824
          fi
