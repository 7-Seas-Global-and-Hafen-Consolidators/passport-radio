name: Passport Clips TV — focused browser evidence
on:
  pull_request:
    paths:
      - 'clips-tv.html'
      - 'js/passport-clips-tv.js'
      - 'css/passport-clips-tv.css'
      - 'data/passport-clips-channels.json'
      - 'js/passport-games-navigation.js'
      - 'tests/passport_clips_tv*'
      - '.github/workflows/passport-clips-tv-validation.yml'
concurrency:
  group: passport-clips-tv-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /js/
            /css/
            /assets/*.js
            /assets/*.css
            /assets/home/
            /images/editorial/wayne-hussey.png
            /images/editorial/2026-10-07-seven/dave-grohl-acdc-highway-to-hell/
            /images/payments/
            /data/
            /docs/passport-clips-tv-20261011/
            /tests/passport_clips_tv*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused preservation tests
        run: node --test tests/passport_clips_tv.test.cjs
      - name: Install test tooling outside application
        run: |
          mkdir /tmp/passport-browser
          cd /tmp/passport-browser
          npm init -y
          npm install playwright
          npx playwright install --with-deps chrome
      - name: Real TV, interlock and responsive checks
        env:
          PASSPORT_CLIPS_ONLY: ${{ github.head_ref == 'feat/passport-clips-tv-hub-20261011' && 'passport-clips-7,passport-clips-9' || '' }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/passport-http.log 2>&1 &
          NODE_PATH=/tmp/passport-browser/node_modules node tests/passport_clips_tv_browser.cjs
      - name: Save real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-clips-tv-browser-evidence
          path: reports/passport-clips-tv/
