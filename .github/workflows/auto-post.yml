name: Passport Telegram Auto Post
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/auto-post.yml', 'scripts/disparar-telegram.mjs', 'tests/telegram-distribution.test.mjs']
  workflow_run:
    workflows: [Passport Pages]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passport-telegram
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 591 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/editorial-channel-distribution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/telegram-distribution.test.mjs
      - name: Inspect public channel history
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://t.me/s/passportradioofficial -o "${RUNNER_TEMP}/telegram-history.html"
          python - <<'PYTHON'
          import os, pathlib, re
          html = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'telegram-history.html').read_text()
          posts = re.findall(r'data-post="passportradioofficial/(\d+)"', html, re.I)
          print(f'Mensagens na página pública: {len(set(posts))}')
          for match in re.finditer(r'data-post="passportradioofficial/(\d+)"([\s\S]*?)(?=data-post="|\Z)', html, re.I):
              for url in sorted(set(re.findall(r'https://(?:www\.)?passportradio\.online/[^"<>\s?]+\.html', match[2]))):
                  print(f'Post público {match[1]}: {url}')
          if not posts:
              raise SystemExit('Página pública sem mensagens verificáveis. Histórico ainda não conciliado.')
          PYTHON
        continue-on-error: true
      - name: Verify Telegram credentials without posting
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/disparar-telegram.mjs --verify
  telegram:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.PASSPORT_TELEGRAM_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/checkout@v4
        with:
          ref: telegram-delivery-state
          path: delivery-state
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure journal author
        run: |
          git -C delivery-state config user.name passport-telegram-bot
          git -C delivery-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Deliver published articles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATE_DIR: delivery-state
        run: node scripts/disparar-telegram.mjs
