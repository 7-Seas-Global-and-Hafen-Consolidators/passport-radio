name: Passport Telegram Auto Post
on:
  push:
    branches: [main]
    paths: ['blog/**', 'editorial/**', 'sitemap-blog.xml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: passport-telegram
  cancel-in-progress: false
jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send new articles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/disparar-telegram.mjs
      - name: Persist sent URL state
        run: |
          if ! git diff --quiet -- data/telegram-sent.json; then
            git config user.name "passport-telegram-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/telegram-sent.json
            git commit -m "chore: remember Telegram publications [skip ci]"
            git push
          fi
