name: Passport Telegram Auto Post
on:
  workflow_run:
    workflows: [Passport Pages]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passport-telegram
  cancel-in-progress: false
jobs:
  telegram:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PASSPORT_TELEGRAM_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/checkout@v4
        with:
          ref: telegram-delivery-state
          path: delivery-state
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure journal author
        run: |
          git -C delivery-state config user.name passport-telegram-bot
          git -C delivery-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Deliver published articles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATE_DIR: delivery-state
        run: node scripts/disparar-telegram.mjs
