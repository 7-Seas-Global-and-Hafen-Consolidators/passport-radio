name: Passport Light PR Migration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feature/passport-light-system-20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout light-system branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Attach light entrypoint to every rendered HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          marker = 'passport-legal-footer.css?v=202608241345'
          link = f'  <link rel="stylesheet" href="/css/{marker}">\n'
          changed = []

          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              original = text
              low = text.lower()

              if marker not in text and '</head>' in low:
                  pos = low.find('</head>')
                  text = text[:pos] + link + text[pos:]

              text = re.sub(
                  r'(<meta\s+name=["\']theme-color["\']\s+content=["\'])#[0-9A-Fa-f]{3,8}(["\'])',
                  r'\1#f7f5f0\2',
                  text,
                  flags=re.IGNORECASE,
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML pages')
          for item in changed:
              print(item)

      - name: Commit page migration into PR branch
        run: |
          git config user.name "Passport Radio"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML migration needed"
          else
            git commit -m "Apply light editorial system to every HTML page"
            git push origin HEAD:${{ github.head_ref }}
          fi
