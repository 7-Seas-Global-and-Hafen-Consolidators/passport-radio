name: Route 66 Definitive Brand Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route66-brand-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace every legacy Passport Radio visual brand
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import html as html_lib

          LOGO = "/images/passport-radio-definitive.jpg"
          ABS_LOGO = "https://www.passportradio.online/images/passport-radio-definitive.jpg"
          CSS_HREF = "/css/route66-everywhere.css?v=20260817-2"
          CSS_TAG = f'<link rel="stylesheet" href="{CSS_HREF}">'
          LOGO_TAG = (
              f'<img class="route66-definitive-logo" '
              f'src="{LOGO}" '
              f'alt="Passport Radio — Route 66">'
          )

          # ---------------------------------------------------------
          # HELPERS
          # ---------------------------------------------------------

          def plain(fragment):
              fragment = re.sub(
                  r'<script\b[^>]*>.*?</script>',
                  '',
                  fragment,
                  flags=re.I | re.S
              )
              fragment = re.sub(
                  r'<style\b[^>]*>.*?</style>',
                  '',
                  fragment,
                  flags=re.I | re.S
              )
              fragment = re.sub(r'<[^>]+>', ' ', fragment)
              fragment = html_lib.unescape(fragment)
              fragment = re.sub(r'\s+', ' ', fragment)
              return fragment.strip().lower()

          def has_brand_class(attrs):
              m = re.search(
                  r'class\s*=\s*["\']([^"\']*)["\']',
                  attrs,
                  flags=re.I
              )
              if not m:
                  return False

              classes = m.group(1).split()

              return any(
                  c == "brand" or
                  c.startswith("brand--") or
                  c == "site-brand" or
                  c == "logo"
                  for c in classes
              )

          def normalize_brand_anchor(match):
              attrs = match.group(1)
              body = match.group(2)

              if not has_brand_class(attrs):
                  return match.group(0)

              body_text = plain(body)

              # Only touch anchors that are clearly Passport branding.
              is_passport_brand = (
                  "passport radio" in body_text
                  or
                  re.search(
                      r'class\s*=\s*["\'][^"\']*brand-mark',
                      body,
                      flags=re.I
                  )
                  or
                  re.search(
                      r'class\s*=\s*["\'][^"\']*brand-logo',
                      body,
                      flags=re.I
                  )
                  or
                  re.search(
                      r'logo-passport-radio|passport-logo|logo_passport|passport-radio-definitive',
                      body,
                      flags=re.I
                  )
              )

              if not is_passport_brand:
                  return match.group(0)

              # Normalize home link so nested /historias pages work too.
              if re.search(r'\bhref\s*=', attrs, flags=re.I):
                  attrs = re.sub(
                      r'\bhref\s*=\s*["\'][^"\']*["\']',
                      'href="/"',
                      attrs,
                      count=1,
                      flags=re.I
                  )
              else:
                  attrs += ' href="/"'

              # Normalize aria-label.
              if re.search(r'\baria-label\s*=', attrs, flags=re.I):
                  attrs = re.sub(
                      r'\baria-label\s*=\s*["\'][^"\']*["\']',
                      'aria-label="Passport Radio — página inicial"',
                      attrs,
                      count=1,
                      flags=re.I
                  )
              else:
                  attrs += ' aria-label="Passport Radio — página inicial"'

              return f'<a{attrs}>{LOGO_TAG}</a>'

          def patch_html(text):
              # -----------------------------------------------------
              # 1. OLD IMAGE REFERENCES / STRUCTURED DATA
              # -----------------------------------------------------

              # Absolute old logo URLs -> absolute definitive URL
              text = re.sub(
                  r'https?://(?:www\.)?passportradio\.online/'
                  r'images/'
                  r'(?:logo-passport-radio[^"\'>\s]*|'
                  r'passport-logo[^"\'>\s]*|'
                  r'logo_passport[^"\'>\s]*)',
                  ABS_LOGO,
                  text,
                  flags=re.I
              )

              # Relative/root old logo paths -> definitive root path
              text = re.sub(
                  r'(?:(?:\.\./)+|(?:\./)?|/)images/'
                  r'(?:logo-passport-radio[^"\'>\s]*|'
                  r'passport-logo[^"\'>\s]*|'
                  r'logo_passport[^"\'>\s]*)',
                  LOGO,
                  text,
                  flags=re.I
              )

              # -----------------------------------------------------
              # 2. BRAND ANCHORS
              # -----------------------------------------------------

              # Important:
              # We replace the WHOLE <a class="brand">...</a>.
              # Therefore PR, brand-copy, strong text, old image etc.
              # disappear together without touching normal page text.
              anchor_re = re.compile(
                  r'<a\b([^>]*)>(.*?)</a>',
                  flags=re.I | re.S
              )

              text = anchor_re.sub(normalize_brand_anchor, text)

              # -----------------------------------------------------
              # 3. REMOVE PREVIOUS ROUTE66 PATCH ASSETS
              # -----------------------------------------------------

              text = re.sub(
                  r'\s*<link\b[^>]*href=["\'][^"\']*'
                  r'route66-(?:brand|definitive|everywhere)\.css'
                  r'[^"\']*["\'][^>]*>',
                  '',
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r'\s*<script\b[^>]*src=["\'][^"\']*'
                  r'route66-brand\.js[^"\']*["\'][^>]*>'
                  r'\s*</script>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # -----------------------------------------------------
              # 4. INSTALL ONE DEFINITIVE CSS
              # -----------------------------------------------------

              if re.search(r'</head\s*>', text, flags=re.I):
                  text = re.sub(
                      r'</head\s*>',
                      f'  {CSS_TAG}\n</head>',
                      text,
                      count=1,
                      flags=re.I
                  )

              return text

          # ---------------------------------------------------------
          # PROCESS EVERY HTML FILE RECURSIVELY
          # ---------------------------------------------------------

          html_files = [
              p for p in Path('.').rglob('*.html')
              if '.git' not in p.parts
          ]

          changed = 0

          for path in html_files:
              original = path.read_text(
                  encoding='utf-8',
                  errors='ignore'
              )

              updated = patch_html(original)

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
                  print(f'CHANGED: {path}')

          print()
          print(f'HTML scanned : {len(html_files)}')
          print(f'HTML changed : {changed}')

          PY

          mkdir -p css

          cat > css/route66-everywhere.css <<'CSS'
          /*
            PASSPORT RADIO
            ROUTE 66 — DEFINITIVE VISUAL BRAND
            -----------------------------------
            This file controls ONLY the definitive logo presentation.
            It must not redesign article bodies, navigation or footers.
          */

          .brand{
            display:flex !important;
            align-items:center !important;
            flex:0 0 auto !important;
            min-width:0 !important;
            text-decoration:none !important;
          }

          .brand .route66-definitive-logo,
          a.brand > .route66-definitive-logo{
            display:block !important;
            width:178px !important;
            height:72px !important;
            max-width:178px !important;
            object-fit:contain !important;
            object-position:left center !important;
            border:0 !important;
            border-radius:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            margin:0 !important;
            padding:0 !important;
          }

          /*
            Safety net for a legacy mark that somehow survives.
            It does NOT create another visible logo.
          */
          .brand-mark,
          .brand-copy,
          .brand__copy,
          .logo__symbol{
            display:none !important;
          }

          /*
            Some old styles force every .brand img to circles,
            44px, 52px etc. Kill those rules.
          */
          .brand img.route66-definitive-logo{
            width:178px !important;
            height:72px !important;
            min-width:178px !important;
            max-width:178px !important;
            border-radius:0 !important;
          }

          footer .brand .route66-definitive-logo,
          .site-footer .brand .route66-definitive-logo{
            width:178px !important;
            height:72px !important;
            min-width:178px !important;
            max-width:178px !important;
          }

          @media (max-width:760px){
            .brand .route66-definitive-logo,
            a.brand > .route66-definitive-logo,
            .brand img.route66-definitive-logo,
            footer .brand .route66-definitive-logo,
            .site-footer .brand .route66-definitive-logo{
              width:132px !important;
              height:58px !important;
              min-width:132px !important;
              max-width:132px !important;
            }
          }
          CSS

      - name: Verify definitive Route 66 branding
        shell: bash
        run: |
          set -u

          FAILED=0

          echo
          echo "========================================"
          echo " OLD LOGO FILE REFERENCES"
          echo "========================================"

          if grep -RniE \
            --include='*.html' \
            --exclude-dir='.git' \
            'logo-passport-radio|passport-logo|logo_passport' . ; then
            echo "ERROR: old logo reference still exists."
            FAILED=1
          else
            echo "NONE"
          fi

          echo
          echo "========================================"
          echo " LEGACY PR / BRAND MARKUP IN HTML"
          echo "========================================"

          if grep -RniE \
            --include='*.html' \
            --exclude-dir='.git' \
            'class=["'\''][^"'\'']*(brand-mark|brand-copy|brand__copy|logo__symbol)[^"'\'']*["'\'']' . ; then
            echo "ERROR: legacy visual brand markup still exists."
            FAILED=1
          else
            echo "NONE"
          fi

          echo
          echo "========================================"
          echo " BRAND ANCHORS WITHOUT DEFINITIVE LOGO"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          failed = False

          anchor_re = re.compile(
              r'<a\b([^>]*)>(.*?)</a>',
              re.I | re.S
          )

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue

              text = path.read_text(
                  encoding='utf-8',
                  errors='ignore'
              )

              for match in anchor_re.finditer(text):
                  attrs = match.group(1)
                  body = match.group(2)

                  class_match = re.search(
                      r'class\s*=\s*["\']([^"\']*)["\']',
                      attrs,
                      re.I
                  )

                  if not class_match:
                      continue

                  classes = class_match.group(1).split()

                  if not (
                      'brand' in classes
                      or 'site-brand' in classes
                  ):
                      continue

                  if 'passport-radio-definitive.jpg' not in body:
                      print(f'ERROR: {path}')
                      print(match.group(0)[:400])
                      print()
                      failed = True

          if failed:
              sys.exit(1)

          print('NONE')
          PY

          if [ $? -ne 0 ]; then
            FAILED=1
          fi

          echo
          echo "========================================"
          echo " HTML WITHOUT ROUTE66 CSS"
          echo "========================================"

          while IFS= read -r -d '' f; do
            if ! grep -q '/css/route66-everywhere.css?v=20260817-2' "$f"; then
              echo "ERROR: $f"
              FAILED=1
            fi
          done < <(
            find . \
              -name '*.html' \
              -not -path './.git/*' \
              -print0
          )

          echo
          echo "========================================"
          echo " DEFINITIVE LOGO STATISTICS"
          echo "========================================"

          TOTAL_HTML=$(
            find . \
              -name '*.html' \
              -not -path './.git/*' |
            wc -l
          )

          LOGO_HTML=$(
            grep -Ril \
              --include='*.html' \
              --exclude-dir='.git' \
              'passport-radio-definitive.jpg' . |
            wc -l
          )

          echo "Total HTML files: $TOTAL_HTML"
          echo "HTML files containing definitive logo: $LOGO_HTML"

          echo
          echo "========================================"

          if [ "$FAILED" -ne 0 ]; then
            echo "ROUTE 66 CLEANUP FAILED"
            exit 1
          fi

          echo "ROUTE 66 BRAND CLEANUP PASSED"
          echo "CILEIDE HAS LEFT THE BUILDING."
          echo "========================================"

      - name: Show changed files
        shell: bash
        run: |
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "Passport Radio Brand Bot"
          git config user.email "actions@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "fix(brand): enforce definitive Route 66 identity sitewide"
          git push
