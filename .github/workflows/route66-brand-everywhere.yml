name: Route 66 Every HTML Article

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-every-html-brand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Physically replace legacy branding in every HTML file
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, html

          LOGO = "/images/passport-radio-definitive.jpg"
          CSS_TAG = '<link rel="stylesheet" href="/css/route66-everywhere.css?v=20260817-1">'
          LOGO_TAG = f'<img class="route66-definitive-logo" src="{LOGO}" alt="Passport Radio — Route 66">'

          def plain(s):
              s = re.sub(r'<script\b[^>]*>.*?</script>', '', s, flags=re.I|re.S)
              s = re.sub(r'<style\b[^>]*>.*?</style>', '', s, flags=re.I|re.S)
              s = re.sub(r'<[^>]+>', ' ', s)
              return re.sub(r'\s+', ' ', html.unescape(s)).strip().lower()

          def replace_brand_markup(chunk):
              chunk = re.sub(r'<span\b[^>]*class=["\'][^"\']*(?:brand-mark|logo__symbol)[^"\']*["\'][^>]*>.*?</span>', LOGO_TAG, chunk, flags=re.I|re.S)
              chunk = re.sub(r'<img\b[^>]*src=["\'][^"\']*(?:logo-passport-radio|passport-logo|logo_passport)[^"\']*["\'][^>]*>', LOGO_TAG, chunk, flags=re.I|re.S)
              anchor_re = re.compile(r'<a\b([^>]*)>(.*?)</a>', re.I|re.S)
              def repl_anchor(m):
                  t = plain(m.group(2))
                  if t in {
                      'passport radio',
                      'passport radio music · history · culture · live',
                      'passport radio music · history · people · places · archives',
                      'passport radio music history culture live',
                  }:
                      return f'<a{m.group(1)}>{LOGO_TAG}</a>'
                  return m.group(0)
              chunk = anchor_re.sub(repl_anchor, chunk)
              chunk = re.sub(r'(<img\b[^>]*route66-definitive-logo[^>]*>)\s*<span\b[^>]*class=["\'][^"\']*(?:brand__copy|brand-copy)[^"\']*["\'][^>]*>.*?</span>', r'\1', chunk, flags=re.I|re.S)
              chunk = re.sub(r'(<img\b[^>]*route66-definitive-logo[^>]*>)\s*<span\b[^>]*>\s*<strong\b[^>]*>\s*Passport\s+Radio\s*</strong>\s*<small\b[^>]*>.*?</small>\s*</span>', r'\1', chunk, flags=re.I|re.S)
              chunk = re.sub(r'<(?:strong|b)\b[^>]*>\s*Passport\s+Radio\s*</(?:strong|b)>', LOGO_TAG, chunk, flags=re.I)
              return chunk

          html_files = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          changed = 0
          for path in html_files:
              text = path.read_text(encoding='utf-8', errors='ignore')
              original = text

              text = re.sub(r'(?i)(?:https?://[^"\']+)?/?images/(?:logo-passport-radio[^"\']*|passport-logo[^"\']*|logo_passport[^"\']*)', LOGO, text)

              text = re.sub(r'<header\b[^>]*>.*?</header>', lambda m: replace_brand_markup(m.group(0)), text, flags=re.I|re.S)
              text = re.sub(r'<footer\b[^>]*>.*?</footer>', lambda m: replace_brand_markup(m.group(0)), text, flags=re.I|re.S)

              # Standalone article HTMLs often do not use semantic header/footer.
              # Patch branding in the first and last 12k chars of EVERY HTML file,
              # never in the article body.
              if len(text) <= 24000:
                  text = replace_brand_markup(text)
              else:
                  text = replace_brand_markup(text[:12000]) + text[12000:-12000] + replace_brand_markup(text[-12000:])

              text = re.sub(r'\s*<link\b[^>]*href=["\'][^"\']*route66-(?:brand|definitive|everywhere)\.css[^"\']*["\'][^>]*>', '', text, flags=re.I)
              text = re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*route66-brand\.js[^"\']*["\'][^>]*>\s*</script>', '', text, flags=re.I|re.S)

              if re.search(r'</head\s*>', text, flags=re.I):
                  text = re.sub(r'</head\s*>', f'  {CSS_TAG}\n</head>', text, count=1, flags=re.I)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          print(f'HTML scanned: {len(html_files)}')
          print(f'HTML changed: {changed}')
          PY

          cat > css/route66-everywhere.css <<'CSS'
          .route66-definitive-logo{display:block!important;width:178px!important;height:72px!important;max-width:none!important;object-fit:contain!important;object-position:left center!important;border:0!important;border-radius:0!important;background:#080808!important;box-shadow:none!important}
          header,.site-header,.header{background:#080808!important;color:#fff!important;border-bottom-color:#262626!important}
          header nav a,.site-header nav a,.header nav a,.main-nav a,.nav a{color:#f3f0e8!important}
          header nav a:hover,.site-header nav a:hover,.header nav a:hover,.main-nav a:hover,.nav a:hover{color:#d71920!important}
          footer{background:#080808!important;color:#f3f0e8!important}
          footer .route66-definitive-logo{width:190px!important;height:92px!important}
          .brand-mark,.logo__symbol{color:transparent!important;font-size:0!important;border:0!important;border-radius:0!important;width:178px!important;min-width:178px!important;height:72px!important;background:#080808 url("/images/passport-radio-definitive.jpg") left center/contain no-repeat!important}
          @media(max-width:760px){.route66-definitive-logo{width:128px!important;height:58px!important}footer .route66-definitive-logo{width:150px!important;height:74px!important}.brand-mark,.logo__symbol{width:128px!important;min-width:128px!important;height:58px!important}}
          CSS

      - name: Verify every HTML page
        shell: bash
        run: |
          FAILED=0
          echo "=== OLD LOGO REFERENCES LEFT ==="
          if grep -RniE --include='*.html' 'logo-passport-radio|passport-logo|logo_passport' . ; then FAILED=1; else echo "NONE"; fi

          echo "=== HTML PAGES WITHOUT DEFINITIVE CSS ==="
          while IFS= read -r -d '' f; do
            if ! grep -q '/css/route66-everywhere.css' "$f"; then
              echo "$f"
              FAILED=1
            fi
          done < <(find . -name '*.html' -not -path './.git/*' -print0)

          echo "=== TOTAL HTML FILES ==="
          find . -name '*.html' -not -path './.git/*' | wc -l

          echo "=== HTML FILES REFERENCING DEFINITIVE LOGO ==="
          grep -Ril --include='*.html' 'passport-radio-definitive.jpg' . | wc -l

          if [ "$FAILED" -ne 0 ]; then
            echo "EXORCISM FAILED"
            exit 1
          fi
          echo "EVERY HTML PAGE IS NOW UNDER ROUTE 66 BRANDING"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "Passport Radio Brand Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "fix(brand): replace legacy branding in every HTML article"
          git push
