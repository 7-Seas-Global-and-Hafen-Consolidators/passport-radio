name: Passport Editorial Feed Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-feed-hygiene.yml'
      - 'tools/editorial_feed_hygiene.py'
      - 'data/editorial-engine.json'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: passport-editorial-feed-hygiene
  cancel-in-progress: true

jobs:
  clean:
    name: Organize and normalize public editorial feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Passport main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run feed hygiene
        run: |
          python -m py_compile tools/editorial_feed_hygiene.py
          python tools/editorial_feed_hygiene.py \
            --feed data/editorial-feed.json \
            --max-items 300 \
            --max-entity-per-day 4 \
            --apply | tee /tmp/editorial-feed-hygiene.json
      - name: Open hygiene PR when needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/editorial-feed.json; then
            echo 'Editorial feed already organized; no PR needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="automation/editorial-feed-hygiene-${GITHUB_RUN_ID}"
          git config user.name "Passport Radio Editorial Hygiene"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/editorial-feed.json
          git commit -m "Passport Editorial: organize public feed"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Passport Editorial: organize public feed" \
            --body "Automatic hygiene pass: removes duplicate/malformed public-feed entries, limits same-topic flooding, corrects strong category mismatches and normalizes obvious pt-BR wording issues. Article pages and protected radio/player areas are untouched."
          echo 'Editorial hygiene PR opened against protected main.' >> "$GITHUB_STEP_SUMMARY"
