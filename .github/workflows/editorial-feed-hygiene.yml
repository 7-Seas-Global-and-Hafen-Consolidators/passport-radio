name: Passport Editorial Feed Hygiene

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit public editorial feed hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Passport main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit feed hygiene
        run: |
          python -m py_compile tools/editorial_feed_hygiene.py
          python tools/editorial_feed_hygiene.py \
            --feed data/editorial-feed.json \
            --max-items 300 \
            --max-entity-per-day 4 | tee /tmp/editorial-feed-hygiene.json
          cat /tmp/editorial-feed-hygiene.json >> "$GITHUB_STEP_SUMMARY"
