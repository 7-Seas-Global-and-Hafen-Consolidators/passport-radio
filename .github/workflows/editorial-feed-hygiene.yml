name: Passport Editorial Feed Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-feed-hygiene.yml'
      - 'tools/editorial_feed_hygiene.py'
      - 'data/editorial-engine.json'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: passport-editorial-feed-hygiene
  cancel-in-progress: true

jobs:
  clean:
    name: Organize and normalize public editorial feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Passport main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run feed hygiene
        run: |
          python -m py_compile tools/editorial_feed_hygiene.py
          python tools/editorial_feed_hygiene.py \
            --feed data/editorial-feed.json \
            --max-items 300 \
            --max-entity-per-day 4 \
            --apply | tee /tmp/editorial-feed-hygiene.json
      - name: Publish hygiene update when needed
        shell: bash
        run: |
          if git diff --quiet -- data/editorial-feed.json; then
            echo 'Editorial feed already organized; no commit needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "Passport Radio Editorial Hygiene"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial-feed.json
          git commit -m "Passport Editorial: organize public feed"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'Editorial feed reorganized and normalized on main.' >> "$GITHUB_STEP_SUMMARY"
