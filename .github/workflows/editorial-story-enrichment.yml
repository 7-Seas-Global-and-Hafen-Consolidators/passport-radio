name: Passport Newsroom — Story Enrichment

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Committed deterministic canary manifest (safety cap: 5)"
        required: false
        default: "ops/canary/canary-002.json"
  workflow_run:
    workflows: ["Passport Editorial Engine — Constitution / Zero-Cost Multiprovider"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: passport-newsroom-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 20
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run Newsroom media safety gate
        shell: bash
        env:
          CANARY_MANIFEST: ${{ github.event.inputs.manifest || 'ops/canary/canary-002.json' }}
        run: |
          python -m py_compile tools/editorial_story_enricher.py tools/newsroom_editorial_confidence.py tools/editorial_engine_quality_router.py tools/newsroom_canary_runner.py tests/test_newsroom_media_golden.py
          python tests/test_newsroom_media_golden.py

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "Automatic post-Editorial-Engine run remains DRY-RUN and cannot consume a canary manifest." >> "$GITHUB_STEP_SUMMARY"
            python tools/editorial_story_enricher.py --limit 5 --run-id "$GITHUB_RUN_ID" --dry-run | tee /tmp/passport-newsroom.json
            cat /tmp/passport-newsroom.json >> "$GITHUB_STEP_SUMMARY"
          else
            case "$CANARY_MANIFEST" in
              ops/canary/*.json) ;;
              *) echo "CANARY_ABORT: manifest must be a committed ops/canary/*.json file" >&2; exit 2 ;;
            esac
            python tools/newsroom_canary_runner.py --manifest "$CANARY_MANIFEST" --run-id "$GITHUB_RUN_ID" --validate-only | tee /tmp/passport-canary-validation.json
            cat /tmp/passport-canary-validation.json >> "$GITHUB_STEP_SUMMARY"
            set +e
            python tools/newsroom_canary_runner.py --manifest "$CANARY_MANIFEST" --run-id "$GITHUB_RUN_ID" | tee /tmp/passport-newsroom.json
            RC=${PIPESTATUS[0]}
            set -e
            cat /tmp/passport-newsroom.json >> "$GITHUB_STEP_SUMMARY"
            echo '```jsonl' >> "$GITHUB_STEP_SUMMARY"
            cat "build/newsroom-audit/$GITHUB_RUN_ID.jsonl" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "$RC" -ne 0 ]; then
              echo "NEWSROOM CANARY FAILED EXPECTATIONS — no review branch will be staged." >> "$GITHUB_STEP_SUMMARY"
              exit "$RC"
            fi
          fi
          echo "Decision audit generated at build/newsroom-audit/$GITHUB_RUN_ID.jsonl." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Newsroom decision audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-newsroom-audit-${{ github.run_id }}
          path: build/newsroom-audit/
          retention-days: 14
          if-no-files-found: warn
      - name: Stage canary enrichment on a review branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "Passport Radio Newsroom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Canary expectations passed with no staged article mutation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main --depth=20
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$BASE_SHA" != "$REMOTE_SHA" ]; then
            echo "NEWSROOM DEFERRED — main advanced; next manual canary retries safely." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          REVIEW_BRANCH="newsroom/canary-${GITHUB_RUN_ID}"
          git checkout -b "$REVIEW_BRANCH"
          git commit -m "Passport Newsroom: deterministic media confidence canary"
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"

          echo "NEWSROOM CANARY STAGED — review branch \`$REVIEW_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Protected \`main\` was not modified. Inspect the canary pages before opening/merging any PR." >> "$GITHUB_STEP_SUMMARY"
