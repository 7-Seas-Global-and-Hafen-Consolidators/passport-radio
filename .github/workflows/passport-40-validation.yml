name: Passport 40 — inventory and browser evidence
on:
  pull_request:
    paths:
      - 'js/passport-radio-grid.js'
      - 'js/passport-clips-tv.js'
      - 'css/passport-radio-grid.css'
      - 'css/passport-clips-tv.css'
      - 'js/world-radio-player.js'
      - 'data/passport-radio-inventory.json'
      - 'tests/passport_40*'
      - '.github/workflows/passport-40-validation.yml'
concurrency:
  group: passport-40-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    # This operation has its own focused preservation, TV and interlock workflow.
    if: github.head_ref != 'feat/passport-clips-tv-hub-20261011' && github.head_ref != 'feat/passport-kpop-26-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /js/
            /css/
            /assets/*.js
            /assets/*.css
            /assets/home/
            /images/editorial/wayne-hussey.png
            /images/editorial/2026-10-07-seven/dave-grohl-acdc-highway-to-hell/
            /images/payments/
            /data/
            /docs/passport-40-20261011/
            /tests/passport_40*
            /editorial/2026/10/09/a-forca-implacavel-de-badmotorfinger-na-historia-do-rock-7f648f963d.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused inventory preservation tests
        run: node --test tests/passport_40_inventory.test.cjs
      - name: Install browser test tooling outside application
        run: |
          mkdir /tmp/passport-browser
          cd /tmp/passport-browser
          npm init -y
          npm install playwright
          npx playwright install --with-deps chrome
      - name: Browser verification and screenshots
        env:
          PASSPORT_40_ONLY: ${{ github.head_ref == 'feat/passport-39-radios-clips-tv-20261011' && 'radio' || '' }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/passport-http.log 2>&1 &
          NODE_PATH=/tmp/passport-browser/node_modules node tests/passport_40_browser.cjs
      - name: Save real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-40-browser-evidence
          path: reports/passport-40/
