name: Participe direct contacts visual evidence
on:
  push:
    branches: [fix/editorial-admin-access-20261010]
    paths: [.github/workflows/participe-direct-visual.yml, tests/participe_direct_visual.cjs]
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /privado/blog-aberto.html
            /css/
            /js/
            /data/
            /images/participe/
            /images/payments/
            /assets/
            /tests/participe_direct_visual.cjs
            /docs/participe-direct-20261010/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/participe_direct_visual.cjs
      - name: Persist evidence on same branch
        run: |
          git config user.name "Passport visual evidence"
          git config user.email "actions@users.noreply.github.com"
          git add docs/participe-direct-20261010
          git commit -m "docs: persist direct contact desktop and mobile evidence"
          git push origin HEAD:fix/editorial-admin-access-20261010
