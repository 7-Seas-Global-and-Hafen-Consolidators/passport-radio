name: Apply Editorial Structural Patch

on:
  push:
    branches:
      - automation/editorial-global-1200-800
    paths:
      - 'tools/apply_editorial_structural_patch.py'
      - '.github/workflows/editorial-structural-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/editorial-global-1200-800
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact structural migration
        shell: bash
        run: |
          if grep -q '^PUBLICATION_HARD_CAP = 800$' tools/editorial_engine.py; then
            echo "Structural migration already applied."
            exit 0
          fi
          python tools/apply_editorial_structural_patch.py
          python -m py_compile \
            tools/editorial_engine.py \
            tools/editorial_engine_copilot.py \
            tools/editorial_engine_global.py \
            tools/editorial_renderer_global.py \
            tools/editorial_tunnel.py \
            tools/editorial_tunnel_global.py

      - name: Commit structural files only
        shell: bash
        run: |
          git config user.name "Passport Radio Editorial Migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/editorial_engine.py tools/editorial_tunnel.py tools/editorial_tunnel_global.py
          if git diff --cached --quiet; then
            echo "No structural changes to commit."
            exit 0
          fi
          CHANGED="$(git diff --cached --name-only)"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Ev '^(tools/editorial_engine.py|tools/editorial_tunnel.py|tools/editorial_tunnel_global.py)$'; then
            echo "Unexpected path detected; aborting."
            exit 2
          fi
          git commit -m "Make global editorial limits structural"
          git push origin HEAD:automation/editorial-global-1200-800
