name: Universal footer integration and QA
on:
  push:
    branches: [fix/universal-footer-20261010]
    paths:
      - js/passport-universal-footer.js
      - css/passport-universal-footer.css
      - tools/integrate_universal_footer.py
      - tests/validate_universal_footer.cjs
      - .github/workflows/universal-footer-validation.yml
permissions:
  contents: write
concurrency:
  group: universal-footer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  footer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.html
            *.js
            *.css
            *.json
            *.py
            *.cjs
            *.yml
            /images/payments/*
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate one loader without modifying existing content
        run: python3 tools/integrate_universal_footer.py
      - name: Install ephemeral browser QA dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Consolidated structural and desktop/mobile validation
        run: |
          node --check js/passport-universal-footer.js
          node tests/validate_universal_footer.cjs
          git diff --check
      - name: Persist only footer integration and evidence on this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' css/passport-footer-fonts.css fonts/passport-footer docs/universal-footer-20261010
          git diff --cached --quiet || git commit -m 'fix(footer): integrate shared institutional footer across public HTML'
          git push origin HEAD:fix/universal-footer-20261010
      - name: Upload visual and structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-footer-evidence
          path: docs/universal-footer-20261010/
