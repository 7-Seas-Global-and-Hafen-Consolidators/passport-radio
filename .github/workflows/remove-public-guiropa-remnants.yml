name: Remove public Guiropa remnants

on:
  push:
    branches:
      - fix/remove-public-guiropa-remnants

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-public-guiropa-remnants
          fetch-depth: 0
      - name: Replace remaining public Guiropa identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          exts = {'.html', '.css', '.js'}
          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              if any(part in {'.git', '.github', 'tools'} for part in p.parts):
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              n = s.replace('GUIROPA WORLD INOVA SIMPLES (I.S.)', 'PASSPORT RADIO')
              n = n.replace('Guiropa World™', 'Passport Radio')
              n = n.replace('Guiropa World.', 'Passport Radio.')
              n = n.replace('Guiropa World', 'Passport Radio')
              n = n.replace('GUIROPA WORLD', 'PASSPORT RADIO')
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  changed.append(str(p))
          print('Changed public files:')
          print('\n'.join(changed) if changed else '(none)')
          PY
          if grep -RniE 'guiropa([[:space:]]+world)?' --include='*.html' --include='*.css' --include='*.js' --exclude-dir=.git --exclude-dir=.github --exclude-dir=tools .; then
            echo 'Public Guiropa remnant still found.' >&2
            exit 1
          fi
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Passport Radio Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining public Guiropa identity'
          git push origin HEAD:fix/remove-public-guiropa-remnants
