<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
  <meta name="google-adsense-account" content="ca-pub-7728480662290062">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7728480662290062" crossorigin="anonymous"></script>
  <title>Passport Signal | Passport Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--red:#df0712;--ink:#090909;--paper:#f3f1ec;--line:#c9c6bf;--muted:#666}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}
    a{color:inherit}
    .top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 4vw;background:#fff;border-bottom:1px solid var(--line)}
    .brand{font-weight:1000;letter-spacing:.08em;text-decoration:none}
    .back{font-size:.72rem;font-weight:900;text-decoration:none}
    main{width:min(1180px,92vw);margin:0 auto;padding:48px 0 80px}
    .kicker{display:flex;justify-content:space-between;gap:20px;border-top:6px solid var(--ink);padding-top:13px;color:var(--red);font-size:.65rem;font-weight:1000;letter-spacing:.11em;text-transform:uppercase}
    h1{max-width:18ch;margin:22px 0 18px;font-size:clamp(2.7rem,7vw,7.2rem);line-height:.86;letter-spacing:-.065em}
    .deck{max-width:76ch;margin:0 0 24px;color:#444;font-size:clamp(1rem,1.5vw,1.35rem);line-height:1.6}
    .meta{display:flex;gap:12px;flex-wrap:wrap;padding:14px 0 24px;border-bottom:1px solid var(--line);color:#777;font-size:.68rem;font-weight:900;text-transform:uppercase}
    .body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:42px;padding-top:34px}
    .story{font-size:1.02rem;line-height:1.82}
    .story p{margin:0 0 1.35em}
    .note{margin-top:34px;padding:20px;border-left:6px solid var(--red);background:#fff;font-size:.82rem;line-height:1.55}
    .rail{border-top:6px solid var(--red);background:#fff}
    .rail h2{margin:0;padding:14px;background:var(--red);color:#fff;font-size:.75rem;letter-spacing:.08em}
    .rel{display:block;padding:15px;border-bottom:1px solid #ddd;text-decoration:none}
    .rel small{display:block;color:var(--red);font-size:.58rem;font-weight:900;text-transform:uppercase;margin-bottom:6px}
    .rel strong{display:block;font-size:.93rem;line-height:1.12}
    .loading{padding:80px 0;font-size:1.1rem;font-weight:800}
    footer{width:min(1180px,92vw);margin:0 auto;padding:28px 0 50px;border-top:2px solid #111;color:#666;font-size:.68rem}
    @media(max-width:850px){.body{grid-template-columns:1fr}.rail{margin-top:10px}.top{position:static}.kicker{flex-direction:column}}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">PASSPORT RADIO</a>
    <a class="back" href="/#passport-editorial-home">← VOLTAR AO RADAR</a>
  </header>

  <main id="app"><div class="loading">Carregando Passport Signal…</div></main>

  <footer><strong>— MR. NOMAD</strong> · Every Song Is A Destination. · Radar Editorial Mundial 24H</footer>

  <script>
  (()=>{
    const ENDPOINT='https://global-signals-ptbr-production.up.railway.app/feed';
    const STORAGE_KEY='passport-global-signals-ptbr-v1';
    const id=new URLSearchParams(location.search).get('id')||'';
    const app=document.getElementById('app');
    const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const decode=(v='')=>{const t=document.createElement('textarea');t.innerHTML=String(v);return t.value.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();};
    const stamp=(v)=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('pt-BR',{dateStyle:'long',timeStyle:'short'}).format(d)};
    const paragraphs=(text)=>{const s=decode(text);if(!s)return '<p>Este Signal está sendo atualizado pelo Radar Editorial Mundial da Passport.</p>';const bits=s.split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/).filter(Boolean);const groups=[];for(let i=0;i<bits.length;i+=2)groups.push(bits.slice(i,i+2).join(' '));return groups.map(x=>`<p>${esc(x)}</p>`).join('');};
    const readStored=()=>{try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return Array.isArray(x.items)?x.items:[]}catch{return[]}};
    const find=(items)=>items.find(x=>String(x.id)===String(id));
    const render=(item,all)=>{
      if(!item){app.innerHTML='<div class="loading">Esse Signal saiu do lote atual. <a href="/#passport-editorial-home">Voltar ao Radar.</a></div>';return;}
      document.title=`${decode(item.title)} | Passport Signal`;
      const rel=(all||[]).filter(x=>x.id!==item.id).slice(0,8);
      app.innerHTML=`
        <div class="kicker"><span>PASSPORT SIGNAL · RADAR EDITORIAL MUNDIAL</span><span>${esc(decode(item.region||'GLOBAL'))}</span></div>
        <h1>${esc(decode(item.title))}</h1>
        <p class="deck">${esc(decode(item.description||item.summary||''))}</p>
        <div class="meta"><span>${esc(decode(item.genre||'MÚSICA'))}</span><span>PT-BR</span>${item.published?`<span>${esc(stamp(item.published))}</span>`:''}</div>
        <div class="body">
          <article class="story">
            ${paragraphs(item.description||item.summary||'')}
            <div class="note"><strong>Passport Signal.</strong> Atualização rápida do Radar Editorial Mundial. As histórias premium do Mr. Nomad recebem desenvolvimento editorial separado.</div>
          </article>
          <aside class="rail"><h2>ÚLTIMOS SIGNALS</h2>${rel.map(x=>`<a class="rel" href="/signal.html?id=${encodeURIComponent(x.id)}"><small>${esc(decode(x.region||'GLOBAL'))}</small><strong>${esc(decode(x.title))}</strong></a>`).join('')}</aside>
        </div>`;
    };

    const stored=readStored();
    const cached=find(stored);
    if(cached)render(cached,stored);

    fetch(ENDPOINT,{cache:'no-store',credentials:'omit',mode:'cors',headers:{Accept:'application/json'}})
      .then(r=>{if(!r.ok)throw Error(r.status);return r.json()})
      .then(d=>{const items=Array.isArray(d.items)?d.items.filter(x=>String(x.language||'').toUpperCase()==='PT-BR'):[];if(items.length){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({savedAt:Date.now(),items}))}catch{};render(find(items)||cached,items)}})
      .catch(()=>{if(!cached)render(null,stored)});
  })();
  </script>
</body>
</html>
