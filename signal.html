<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
  <meta name="google-adsense-account" content="ca-pub-7728480662290062">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7728480662290062" crossorigin="anonymous"></script>
  <title>Passport Signal | Passport Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--red:#df0712;--ink:#090909;--paper:#f3f1ec;--line:#c9c6bf;--muted:#666}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif} a{color:inherit}
    .top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 4vw;background:#fff;border-bottom:1px solid var(--line)}
    .brand{font-weight:1000;letter-spacing:.08em;text-decoration:none}.back{font-size:.72rem;font-weight:900;text-decoration:none}
    main{width:min(1180px,92vw);margin:0 auto;padding:48px 0 80px}.kicker{display:flex;justify-content:space-between;gap:20px;border-top:6px solid var(--ink);padding-top:13px;color:var(--red);font-size:.65rem;font-weight:1000;letter-spacing:.11em;text-transform:uppercase}
    h1{max-width:18ch;margin:22px 0 18px;font-size:clamp(2.7rem,7vw,7.2rem);line-height:.86;letter-spacing:-.065em}.deck{max-width:76ch;margin:0 0 24px;color:#444;font-size:clamp(1rem,1.5vw,1.35rem);line-height:1.6}
    .meta{display:flex;gap:12px;flex-wrap:wrap;padding:14px 0 24px;border-bottom:1px solid var(--line);color:#777;font-size:.68rem;font-weight:900;text-transform:uppercase}.body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:42px;padding-top:34px}
    .story{font-size:1.02rem;line-height:1.82}.story p{margin:0 0 1.35em}.note{margin-top:34px;padding:20px;border-left:6px solid var(--red);background:#fff;font-size:.82rem;line-height:1.55}
    .rail{border-top:6px solid var(--red);background:#fff}.rail h2{margin:0;padding:14px;background:var(--red);color:#fff;font-size:.75rem;letter-spacing:.08em}.rel{display:block;padding:15px;border-bottom:1px solid #ddd;text-decoration:none}.rel small{display:block;color:var(--red);font-size:.58rem;font-weight:900;text-transform:uppercase;margin-bottom:6px}.rel strong{display:block;font-size:.93rem;line-height:1.12}
    .loading{padding:80px 0;font-size:1.1rem;font-weight:800} footer{width:min(1180px,92vw);margin:0 auto;padding:28px 0 50px;border-top:2px solid #111;color:#666;font-size:.68rem}
    @media(max-width:850px){.body{grid-template-columns:1fr}.rail{margin-top:10px}.top{position:static}.kicker{flex-direction:column}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">PASSPORT RADIO</a><a class="back" href="/#passport-editorial-home">← VOLTAR AO RADAR</a></header>
  <main id="app"><div class="loading">Traduzindo Passport Signal…</div></main>
  <footer><strong>— MR. NOMAD</strong> · Every Song Is A Destination. · Radar Editorial Mundial 24H</footer>
  <script>
  (()=>{
    const ENDPOINT='https://global-signals-production.up.railway.app/feed';
    const STORAGE_KEY='passport-global-signals-ptbr-v3';
    const TRANSLATION_KEY='passport-global-signals-translations-v3';
    const id=new URLSearchParams(location.search).get('id')||'';
    const app=document.getElementById('app');
    const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const decode=(v='')=>{const t=document.createElement('textarea');t.innerHTML=String(v);return t.value.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();};
    const stamp=(v)=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('pt-BR',{dateStyle:'long',timeStyle:'short'}).format(d)};
    const norm=(v='')=>{v=String(v).toLowerCase();if(v.startsWith('pt'))return'pt';if(v.startsWith('en'))return'en';if(v.startsWith('es'))return'es';if(v.startsWith('de'))return'de';if(v.startsWith('fr'))return'fr';if(v.startsWith('it'))return'it';if(v.startsWith('ja'))return'ja';if(v.startsWith('ko'))return'ko';if(v.startsWith('zh'))return'zh-CN';return'auto';};
    const rawify=(x,i)=>({id:decode(x.id||`signal-${i}`),title:decode(x.title),summary:decode(x.summary||x.description||x.deck||''),date:x.date||x.published_at||x.published||'',region:decode(x.region||'Global'),genre:decode(x.genre||'Música'),language:decode(x.language||'')});
    const key=s=>`${s.id}::${s.title}`;
    const readCache=()=>{try{return JSON.parse(localStorage.getItem(TRANSLATION_KEY)||'{}')||{}}catch{return{}}};
    const cache=readCache();
    const saveCache=()=>{try{localStorage.setItem(TRANSLATION_KEY,JSON.stringify(cache))}catch{}};
    const readStored=()=>{try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return Array.isArray(x.items)?x.items:[]}catch{return[]}};
    const remember=(items)=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify({savedAt:Date.now(),items:items.slice(0,240)}))}catch{}};
    const find=(items)=>items.find(x=>String(x.id)===String(id));
    const paragraphs=(text)=>{const s=decode(text);if(!s)return '<p>Este Signal está sendo atualizado pelo Radar Editorial Mundial da Passport.</p>';const bits=s.split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/).filter(Boolean);const groups=[];for(let i=0;i<bits.length;i+=2)groups.push(bits.slice(i,i+2).join(' '));return groups.map(x=>`<p>${esc(x)}</p>`).join('');};

    async function googleTranslate(text,s){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const q=new URLSearchParams({client:'gtx',sl:norm(s.language),tl:'pt',dt:'t',q:text});const r=await fetch(`https://translate.googleapis.com/translate_a/single?${q}`,{cache:'no-store',credentials:'omit',mode:'cors',signal:c.signal});if(!r.ok)throw Error(r.status);const d=await r.json();const out=Array.isArray(d&&d[0])?d[0].map(x=>Array.isArray(x)?x[0]||'':'').join(''):'';if(!out.trim())throw Error('empty');return decode(out)}finally{clearTimeout(t)}}
    async function memoryTranslate(text,s){const src=norm(s.language);if(src==='auto'||src==='pt')throw Error('lang');const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const q=new URLSearchParams({q:text,langpair:`${src}|pt-BR`});const r=await fetch(`https://api.mymemory.translated.net/get?${q}`,{cache:'no-store',credentials:'omit',mode:'cors',signal:c.signal});if(!r.ok)throw Error(r.status);const d=await r.json();const out=decode(d&&d.responseData&&d.responseData.translatedText||'');if(!out)throw Error('empty');return out}finally{clearTimeout(t)}}
    async function tx(text,s){try{return await googleTranslate(text,s)}catch{return memoryTranslate(text,s)}}
    async function translate(s){if(norm(s.language)==='pt')return{...s,language:'PT-BR'};const k=key(s),cc=cache[k];if(cc&&cc.title)return{...s,title:cc.title,summary:cc.summary||'',language:'PT-BR'};let title='',summary='';const marker='[[[PASSPORT_SPLIT_9F3A]]]';try{const z=await tx(`${s.title}\n${marker}\n${s.summary||''}`,s),p=z.split(marker);if(p.length>=2){title=decode(p.shift());summary=decode(p.join(marker))}}catch{}if(!title){try{title=await tx(s.title,s)}catch{return null}if(s.summary){try{summary=await tx(s.summary,s)}catch{summary=''}}}cache[k]={title:decode(title),summary:decode(summary),savedAt:Date.now()};saveCache();return{...s,title:decode(title),summary:decode(summary),language:'PT-BR'}}

    const render=(item,all)=>{if(!item){app.innerHTML='<div class="loading">Este Signal ainda está sendo traduzido. <a href="/#passport-editorial-home">Voltar ao Radar.</a></div>';return;}document.title=`${decode(item.title)} | Passport Signal`;const rel=(all||[]).filter(x=>x.id!==item.id).slice(0,8);app.innerHTML=`<div class="kicker"><span>PASSPORT SIGNAL · RADAR EDITORIAL MUNDIAL</span><span>${esc(decode(item.region||'GLOBAL'))}</span></div><h1>${esc(decode(item.title))}</h1><p class="deck">${esc(decode(item.summary||item.description||''))}</p><div class="meta"><span>${esc(decode(item.genre||'MÚSICA'))}</span><span>PT-BR</span>${item.date?`<span>${esc(stamp(item.date))}</span>`:''}</div><div class="body"><article class="story">${paragraphs(item.summary||item.description||'')}<div class="note"><strong>Passport Signal.</strong> Atualização rápida do Radar Editorial Mundial. As histórias premium do Mr. Nomad recebem desenvolvimento editorial separado.</div></article><aside class="rail"><h2>ÚLTIMOS SIGNALS</h2>${rel.map(x=>`<a class="rel" href="/signal.html?id=${encodeURIComponent(x.id)}"><small>${esc(decode(x.region||'GLOBAL'))}</small><strong>${esc(decode(x.title))}</strong></a>`).join('')}</aside></div>`;};

    const stored=readStored(); const cached=find(stored); if(cached)render(cached,stored);
    fetch(ENDPOINT,{cache:'no-store',credentials:'omit',mode:'cors',headers:{Accept:'application/json'}})
      .then(r=>{if(!r.ok)throw Error(r.status);return r.json()})
      .then(async d=>{const raw=(Array.isArray(d.items)?d.items:[]).map(rawify).filter(x=>x.title);const target=find(raw);if(!target){if(!cached)render(null,stored);return;}const main=await translate(target);if(!main){if(!cached)render(null,stored);return;}const relRaw=raw.filter(x=>x.id!==target.id).slice(0,8);const relDone=(await Promise.allSettled(relRaw.map(translate))).filter(x=>x.status==='fulfilled'&&x.value).map(x=>x.value);const all=[main,...relDone];remember(all);render(main,all);})
      .catch(()=>{if(!cached)render(null,stored)});
  })();
  </script>
</body>
</html>
