<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow"><title>Em análise editorial | Passport Radio</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111;font-family:'Instrument Sans',sans-serif;padding:1rem;box-sizing:border-box}.card{width:min(100%,600px);border:2px solid #111;padding:2rem;box-sizing:border-box;box-shadow:7px 7px #C41E3A}h1{font-family:'Bodoni Moda',serif;color:#C41E3A}button{background:#C41E3A;color:#fff;border:0;padding:1rem;font-weight:700;cursor:pointer}a{color:#C41E3A}</style></head><body>
<main class="card"><a href="/">Passport Radio</a><h1>EM ANÁLISE EDITORIAL</h1><h2 id="band"></h2><p>Conheça a Passport Radio e compartilhe a história da sua banda.</p><button type="button" id="share">📢 COMPARTILHAR CANDIDATURA</button><p id="status" role="status"></p><p><a href="/divulgar-bandas.html">Participe da Passport</a></p><small>Primeiro a história. Depois a música.</small></main>
<script>
const name=new URLSearchParams(location.search).get('banda')?.trim().slice(0,100)||'Sua banda';
document.getElementById('band').textContent=name;
document.getElementById('share').addEventListener('click',async()=>{
  const data={title:'Passport Radio — '+name,text:'Conheça '+name+' na Passport Radio',url:location.href};
  try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent='Link copiado!';}}
  catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent='Copie o endereço desta página para compartilhar.';}
});
</script><script src="/js/passport-universal-footer.js?v=20261010" defer></script>
</body></html>
