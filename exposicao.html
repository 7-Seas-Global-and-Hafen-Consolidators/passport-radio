ground:#071522;box-shadow:0 24px 70px rgba(0,0,0,.34)}.star:nth-child(7n+1){grid-column:span 2}.star img{width:100%;height:100%;min-height:430px;object-fit:cover;filter:saturate(.78) brightness(.76);transition:transform .8s ease,filter .8s ease}.star:hover img{transform:scale(1.035);filter:saturate(.96) brightness(.88)}.caption{position:absolute;inset:auto 0 0;padding:74px 24px 24px;background:linear-gradient(transparent,rgba(2,6,11,.96))}.caption small{color:var(--gold2);font-size:.58rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.caption h2{margin:8px 0 0;font:700 clamp(1.9rem,3vw,3.1rem)/.95 "Cormorant Garamond",serif}.caption p{margin:9px 0 0;color:var(--muted);font-size:.74rem}.final{padding:90px 0 120px;border-top:1px solid var(--line);text-align:center}.final h2{margin:0;font:700 clamp(3rem,7vw,6rem)/.9 "Cormorant Garamond",serif}.final h2 span{display:block;color:var(--gold2)}.ritual{margin-top:30px;color:var(--gold2);font:700 clamp(2rem,5vw,4rem) "Cormorant Garamond",serif}.empty{max-width:900px;padding:60px;border:1px solid var(--line);border-radius:24px;background:rgba(2,6,11,.6)}@media(max-width:820px){.gallery{grid-template-columns:1fr 1fr}.star:nth-child(7n+1){grid-column:span 2}.stats{grid-template-columns:1fr}}@media(max-width:560px){.gallery{grid-template-columns:1fr}.star,.star:nth-child(7n+1){grid-column:auto}.hero h1{font-size:3.8rem}.top{min-height:70px}.back{padding:9px 12px}}
